// Best-effort category guess from a Tende transaction's remark text —
// informed directly by how Happynet has actually been categorizing these
// same transactions by hand for the last two months (cross-checked
// against their real TENDE EXPENSE LOG). Always overridable after import;
// this never silently commits to a wrong category, it just saves typing
// on the easy majority of rows.
const TENDE_CATEGORY_RULES = [
  [/fuel|petrol|diesel|rubis|shell|total /i, 'Fuel'],
  [/transport|matatu|boda|delivery/i, 'Transport'],
  [/token|electricity|kplc|hotspot token/i, 'Electricity'],
  [/internet|bandwidth|bypass|oneisp|data bundle|data buddle/i, 'Internet & Bandwidth'],
  [/\brent\b|realtors/i, 'Rent'],
  [/commission|caretaker/i, 'Commission'],
  [/repair|socket|patrix|car wash|maintenance/i, 'Repairs'],
  [/toilet paper|printing|stationery|office supplies/i, 'Office Supplies'],
  [/advert|marketing|promo/i, 'Marketing'],
  [/welfare|charity/i, 'Welfare'],
  [/reimburse/i, 'Reimbursement'],
  [/router|poe|cable|inventory|xpon/i, 'Inventory'],
  [/salary|wage|labour|advance|payroll/i, 'Payroll'],
];
function guessTendeCategory(remark, tendeWallet){
  const text = remark || '';
  for(const [re, cat] of TENDE_CATEGORY_RULES) if(re.test(text)) return cat;
  if(/INVENTORY/i.test(tendeWallet)) return 'Inventory';
  return 'Other';
}
// Tende's own STATUS MESSAGE spells out the real vendor name (e.g. "...to
// M-PESA Till 8697324 - NEW ZULUS 5 on 27th Aug...") — extract it instead
// of falling back to a bare till/phone number.
function extractTendeVendor(statusMessage, remark, receiver){
  if(statusMessage){
    const m = statusMessage.match(/(?:Till|to)\s+\d+\s*-\s*([A-Za-z0-9 .'&]+?)\s+on\s+\d/);
    if(m) return m[1].trim();
  }
  return receiver ? String(receiver).replace(/^="?|"?$/g, '') : (remark || '');
}
// Detects and parses Happynet's raw Tende "payments report" export
// directly — no manual pre-processing into the simplified layout needed.
// Two things it deliberately does that a naive import wouldn't:
//   1. Drops SND_TENDE rows — these are transfers between Happynet's own
//      Tende sub-wallets (Overall -> Payroll, -> Inventory, etc.), not
//      real money leaving the business. Importing them would double-count
//      every shilling: once as an internal transfer, again as the real
//      external payment it eventually funds.
//   2. Only imports STATUS = SUCCESS rows.
function parseRawTendeGrid(grid){
  const header = (grid[0]||[]).map(c=>String(c||'').trim().toUpperCase());
  const need = ['DATE INITIATED','SERVICE','STATUS','REF NO','AMOUNT'];
  if(!need.every(h=>header.includes(h))) return null; // not this format — let the caller fall through
  const col = name => header.indexOf(name);
  const idx = {
    dateInit: col('DATE INITIATED'), dateAppr: col('DATE APPROVED'), account: col('ACCOUNT'),
    service: col('SERVICE'), amount: col('AMOUNT'), charge: col('CHARGE'), receiver: col('RECEIVER'),
    remark: col('REMARK'), refNo: col('REF NO'), status: col('STATUS'), statusMsg: col('STATUS MESSAGE')
  };
  const rows = [];
  let skippedInternal = 0, skippedFailed = 0;
  for(let r=1; r<grid.length; r++){
    const row = grid[r]; if(!row || row.every(c=>c===null||c==='')) continue;
    const status = String(row[idx.status]||'').trim().toUpperCase();
    if(status !== 'SUCCESS'){ skippedFailed++; continue; }
    const service = String(row[idx.service]||'').trim().toUpperCase();
    if(service === 'SND_TENDE'){ skippedInternal++; continue; }
    const rawDate = row[idx.dateAppr] || row[idx.dateInit];
    const dateObj = rawDate instanceof Date ? rawDate : new Date(String(rawDate).split(' ')[0]);
    if(isNaN(dateObj)) { skippedFailed++; continue; }
    const tendeWallet = String(row[idx.account]||'').replace(/\s*\(KOC\d+\)/i,'').trim();
    const amount = Number(String(row[idx.amount]||'0').replace(/[^0-9.\-]/g,'')) || 0;
    const charges = Number(String(row[idx.charge]||'0').replace(/[^0-9.\-]/g,'')) || 0;
    rows.push({
      date: dateObj.toISOString().slice(0,10),
      txn_ref: String(row[idx.refNo]||'').trim(),
      account_used: service === 'SEND BANK' ? 'Bank Account' : 'M-Pesa Till',
      category: guessTendeCategory(row[idx.remark], tendeWallet),
      description: String(row[idx.remark]||''),
      paid_to: extractTendeVendor(row[idx.statusMsg], row[idx.remark], row[idx.receiver]),
      amount_kes: amount, charges_kes: charges, owner_funded: false
    });
  }
  return { rows, skippedInternal, skippedFailed };
}

async function handleExpenseImport(ev){
  const file = ev.target.files[0];
  if(!file) return;
  const statusEl = document.getElementById('import-status');
  if(statusEl) statusEl.innerHTML = `<span class="hint">Reading ${file.name}…</span>`;
  try{
    const data = await file.arrayBuffer();
    const wb = XLSX.read(data, {type:'array', cellDates:true});
    const wsName = wb.SheetNames.find(n=>/expense|tende/i.test(n)) || wb.SheetNames[0];
    const ws = wb.Sheets[wsName];
    const grid = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:null});

    // Raw Tende export — recognized by its exact column set, handled by a
    // dedicated parser above rather than the generic header-hunting logic
    // below (which is for the simplified, manually-prepared layout).
    const rawTende = parseRawTendeGrid(grid);
    if(rawTende){
      let imported=0, skippedDupe=0; const errors=[];
      if(rawTende.skippedInternal) errors.push(`${rawTende.skippedInternal} internal Tende wallet transfer(s) (SND_TENDE) correctly excluded — not real expenses.`);
      const seenRefs = new Set(state.expenses.map(e=>e.txn_ref.toLowerCase()));
      const newRows = [];
      for(const r of rawTende.rows){
        if(!r.txn_ref || seenRefs.has(r.txn_ref.toLowerCase())){
          skippedDupe++; continue;
        }
        newRows.push({ id:uid(), ...r });
        seenRefs.add(r.txn_ref.toLowerCase());
        imported++;
      }
      newRows.sort((a,b)=>a.date<b.date?-1:1);

      let confirmedRows = [];
      if(newRows.length){
        if(statusEl) statusEl.innerHTML = `<span class="hint">Saving ${newRows.length} rows…</span>`;
        try{
          const entries = newRows.map(CORE_ENTITY_CONFIG.expenses.toApi);
          const apiResult = await apiCreate('/api/expenses', { branch_id: state.branchId, entries });
          const insertedIds = new Set((apiResult.inserted||[]).map(x=>x.id));
          confirmedRows = newRows.filter(r=>insertedIds.has(r.id));
          for(const skip of (apiResult.skipped||[])){ skippedDupe++; errors.push(skip.reason || 'A row was skipped by the server.'); }
        }catch(err){
          importResult = {imported:0, skippedDupe, skippedInvalid:rawTende.skippedFailed, errors:[...errors, 'Save failed: '+err.message]};
          if(statusEl) statusEl.innerHTML=''; render(); ev.target.value=''; return;
        }
      }
      state.expenses = state.expenses.concat(confirmedRows);
      if(lastSynced) lastSynced.expenses = JSON.parse(JSON.stringify(state.expenses));
      importResult = { imported: confirmedRows.length, skippedDupe, skippedInvalid: rawTende.skippedFailed, errors };
      render();
      ev.target.value = '';
      return;
    }

    const wants = {
      date: /^date$/i,
      txn_ref: /txn.*ref|reference/i,
      account_used: /account/i,
      category: /categor/i,
      description: /descri/i,
      paid_to: /paid ?to/i,
      amount_kes: /^amount\b|amount.*kes/i,
      charges_kes: /charge/i,
      owner_funded: /owner.*funded|related.?party/i
    };

    let headerRowIdx = -1, headerMap = {};
    for(let r=0;r<Math.min(grid.length,25);r++){
      const row = grid[r]||[];
      const rowStr = row.map(c=>String(c||'').trim());
      const hasDate = rowStr.some(c=>/^date$/i.test(c));
      const hasAmount = rowStr.some(c=>/amount/i.test(c));
      if(hasDate && hasAmount){
        headerRowIdx = r;
        row.forEach((cell,ci)=>{
          const c = String(cell||'').trim();
          for(const [key,re] of Object.entries(wants)){
            if(re.test(c) && !(key in headerMap)) headerMap[key]=ci;
          }
        });
        break;
      }
    }
    if(headerRowIdx===-1){
      importResult = {imported:0, skippedDupe:0, skippedInvalid:0, errors:['Could not find a header row containing a "Date" column and an "Amount" column — check the file matches the expected layout.']};
      if(statusEl) statusEl.innerHTML='';
      render(); return;
    }

    let imported=0, skippedDupe=0, skippedInvalid=0; const errors=[];
    const seenRefs = new Set(state.expenses.map(e=>e.txn_ref.toLowerCase()));
    const newRows = [];
    for(let r=headerRowIdx+1;r<grid.length;r++){
      const row = grid[r]||[];
      if(row.every(c=>c===null||c==='')) continue;
      const rawDate = headerMap.date!=null ? row[headerMap.date] : null;
      const rawRef = headerMap.txn_ref!=null ? row[headerMap.txn_ref] : null;
      const rawAmount = headerMap.amount_kes!=null ? row[headerMap.amount_kes] : null;
      if(rawDate==null || rawAmount==null || rawRef==null || String(rawRef).trim()===''){
        skippedInvalid++; continue;
      }
      let dateObj = rawDate instanceof Date ? rawDate : new Date(rawDate);
      if(isNaN(dateObj)){ skippedInvalid++; continue; }
      const dateStr = dateObj.toISOString().slice(0,10);
      const txn_ref = String(rawRef).trim();
      if(seenRefs.has(txn_ref.toLowerCase())){
        skippedDupe++; errors.push(`Row ${r+1}: Txn Ref "${txn_ref}" already exists — skipped`); continue;
      }
      const amount = Number(String(rawAmount).replace(/[^0-9.\-]/g,'')) || 0;
      const charges = headerMap.charges_kes!=null ? (Number(String(row[headerMap.charges_kes]||'0').replace(/[^0-9.\-]/g,''))||0) : 0;
      const ownerRaw = headerMap.owner_funded!=null ? String(row[headerMap.owner_funded]||'').trim().toUpperCase() : '';
      newRows.push({
        id:uid(), date:dateStr, txn_ref,
        account_used: headerMap.account_used!=null && row[headerMap.account_used] ? row[headerMap.account_used] : 'Bank Account',
        category: headerMap.category!=null && row[headerMap.category] ? row[headerMap.category] : 'Other',
        description: headerMap.description!=null ? (row[headerMap.description]||'') : '',
        paid_to: headerMap.paid_to!=null ? (row[headerMap.paid_to]||'') : '',
        amount_kes: amount, charges_kes: charges,
        owner_funded: ownerRaw==='Y'||ownerRaw==='YES'||ownerRaw==='TRUE'
      });
      seenRefs.add(txn_ref.toLowerCase());
      imported++;
    }
    // Insert in date order, oldest first -- matches how the original spreadsheet was arranged
    newRows.sort((a,b)=>a.date<b.date?-1:1);

    // Send the whole batch through the bulk import endpoint rather than
    // letting the generic background sync create them one at a time — this
    // re-checks duplicates server-side too (catches anything imported by
    // someone else since this session loaded) and reports exactly what it
    // skipped and why.
    let confirmedRows = [];
    if(newRows.length){
      if(statusEl) statusEl.innerHTML = `<span class="hint">Saving ${newRows.length} rows…</span>`;
      try{
        const entries = newRows.map(CORE_ENTITY_CONFIG.expenses.toApi);
        const apiResult = await apiCreate('/api/expenses', { branch_id: state.branchId, entries });
        const insertedIds = new Set((apiResult.inserted||[]).map(x=>x.id));
        confirmedRows = newRows.filter(r=>insertedIds.has(r.id));
        for(const skip of (apiResult.skipped||[])){
          skippedDupe++;
          errors.push(skip.reason || 'A row was skipped by the server.');
        }
      }catch(err){
        importResult = {imported:0, skippedDupe, skippedInvalid, errors:[...errors, 'Save failed: '+err.message]};
        if(statusEl) statusEl.innerHTML='';
        render();
        ev.target.value = '';
        return;
      }
    }
    state.expenses = state.expenses.concat(confirmedRows);
    // Keep the sync snapshot in step so the debounced background save
    // doesn't try to re-create rows that are already persisted.
    if(lastSynced) lastSynced.expenses = JSON.parse(JSON.stringify(state.expenses));
    importResult = {imported: confirmedRows.length, skippedDupe, skippedInvalid, errors};
    render();
  } catch(err){
    importResult = {imported:0, skippedDupe:0, skippedInvalid:0, errors:['Could not read this file: '+err.message]};
    render();
  }
  ev.target.value = '';
}

function viewTax(){
  const d = dashboardData(); // single source of truth for tax reserve balance
  const applicable = state.taxObligations.filter(t=>t.applicable);
  const now = new Date(); const in30 = new Date(); in30.setDate(now.getDate()+30);
  const dueSoon = applicable.filter(t => {
    if(t.frequency==='Monthly') return true; // recurring monthly always counts within 30d window
    if(t.manual_next_due_date) return new Date(t.manual_next_due_date) <= in30;
    return false;
  });
  const estimatedDueSoon = dueSoon.reduce((s,t)=>s+Number(t.estimated_amount_kes||0),0);
  const reserveBalance = d.alloc.tax; // pulled from Monthly Dashboard's real tax reserve total
  const shortfall = estimatedDueSoon - reserveBalance;

  return `
    <div class="topbar"><div><h1>Tax Compliance Calendar</h1><div class="sub">Reserve balance is pulled live from the Monthly Dashboard — one source of truth.</div></div></div>

    <div class="grid kpi">
      <div class="card kpi"><h3>Tax Reserve Balance (${monthLabel(d.ym)})</h3><div class="big" style="font-size:22px;">${KES(reserveBalance)}</div></div>
      <div class="card kpi"><h3>Estimated Due, Next 30 Days</h3><div class="big" style="font-size:22px;">${KES(estimatedDueSoon)}</div></div>
      <div class="card kpi"><h3>Status</h3>
        <div style="margin-top:6px;">${shortfall > 0 ? `<span class="tag alert">Reserve shortfall of ${KES(shortfall)}</span>` : `<span class="tag good">Reserve covers the next 30 days</span>`}</div>
      </div>
    </div>

    <div class="section-head"><h2>Obligation register</h2></div>
    <div class="table-wrap"><table>
      <thead><tr><th class="txt">Tax Type</th><th class="txt">Applicable</th><th class="txt">Frequency</th><th>Due</th><th>Est. Amount</th><th class="txt">Authority</th><th></th></tr></thead>
      <tbody>
        ${state.taxObligations.map(t=>`
          <tr>
            <td class="txt">${t.tax_type}</td>
            <td class="txt"><input type="checkbox" data-tax-applicable="${t.id}" ${t.applicable?'checked':''} ${canWrite()?'':'disabled'}></td>
            <td class="txt">
              <select data-tax-frequency="${t.id}" ${canWrite()?'':'disabled'}>
                ${['Monthly','Quarterly','Annual'].map(f=>`<option ${t.frequency===f?'selected':''}>${f}</option>`).join('')}
              </select>
            </td>
            <td class="txt">${t.frequency==='Monthly'
              ? `Day <input style="width:52px; display:inline; padding:4px 6px;" type="number" min="1" max="28" data-tax-dueday="${t.id}" value="${t.due_day_of_month}" ${canWrite()?'':'disabled'}>`
              : `<input type="date" data-tax-manualdue="${t.id}" value="${t.manual_next_due_date||''}" ${canWrite()?'':'disabled'}>`}</td>
            <td><input style="width:110px;" type="number" min="0" data-tax-amount="${t.id}" value="${t.estimated_amount_kes}" ${canWrite()?'':'disabled'}></td>
            <td class="txt"><input style="width:100px;" type="text" data-tax-authority="${t.id}" value="${t.filing_authority}" ${canWrite()?'':'disabled'}></td>
            <td>${canWrite() ? `<button class="btn ghost sm" data-del-tax="${t.id}">Remove</button>` : ''}</td>
          </tr>`).join('')}
      </tbody>
    </table></div>
    ${canWrite() ? `<div class="section-head"></div><button class="btn ghost sm" id="btn-add-tax">+ Add custom tax type</button>` : ''}

    ${taxIntelState.loading || taxIntelState.data || taxIntelState.error ? taxIntelSectionHtml() : `
      <div class="section-head"><h2>Tax Intelligence</h2></div>
      <div class="card"><button class="btn ghost sm" id="btn-load-tax-intel">Load filing periods, deadlines &amp; compliance status</button></div>

/* ---------------- Tax Intelligence (per-period filing/payment tracking) ---------------- */
let taxIntelState = { loading:false, data:null, error:null, formError:null };

async function loadTaxIntel(){
  taxIntelState.loading = true; render();
  try{
    const res = await apiFetch(`/api/tax-intelligence?branch_id=${state.branchId}`, { method:'GET' });
    const body = await res.json();
    if(!res.ok) throw new Error(body.error || 'Could not load tax intelligence.');
    taxIntelState.data = body;
    taxIntelState.error = null;
  }catch(e){ taxIntelState.error = e.message; }
  taxIntelState.loading = false;
  render();
}
async function createTaxPeriod(obligationId, periodStart, periodEnd, amountDue){
  taxIntelState.formError = null;
  try{
    const res = await apiFetch('/api/tax-intelligence', {
      method:'POST', headers: JSONH,
      body: JSON.stringify({ branch_id: state.branchId, action:'period', tax_obligation_id: obligationId, period_start: periodStart, period_end: periodEnd, amount_due_kes: amountDue })
    });
    const body = await res.json();
    if(!res.ok) throw new Error(body.error || 'Could not create period.');
    await loadTaxIntel();
  }catch(e){ taxIntelState.formError = e.message; render(); }
}
async function fileTaxPeriod(periodId){
  const ref = (await promptDialog('Filing reference (optional):')) || null;
  try{
    const res = await apiFetch('/api/tax-intelligence', { method:'POST', headers: JSONH, body: JSON.stringify({ branch_id: state.branchId, action:'file', tax_period_id: periodId, filing_status:'filed', filing_reference: ref }) });
    const body = await res.json();
    if(!res.ok) throw new Error(body.error || 'Could not mark as filed.');
    await loadTaxIntel();
  }catch(e){ showToast(e.message, 'error'); }
}
async function recordTaxPayment(periodId, dueRemaining){
  const amountStr = await promptDialog(`Payment amount (KES) — remaining due is ${dueRemaining}:`, dueRemaining);
  if(!amountStr) return;
  const amount = Number(amountStr);
  if(!amount || amount<=0){ showToast('Enter a valid amount.', 'error'); return; }
  try{
    const res = await apiFetch('/api/tax-intelligence', { method:'POST', headers: JSONH, body: JSON.stringify({ branch_id: state.branchId, action:'payment', tax_period_id: periodId, amount_kes: amount, payment_date: todayISO() }) });
    const body = await res.json();
    if(!res.ok) throw new Error(body.error || 'Could not record payment.');
    await loadTaxIntel();
  }catch(e){ showToast(e.message, 'error'); }
}

/* ---------------- Financial Statements (Phase 13 foundation) ----------------
   Read-only view over the ledger fixed in hfms_foundation_fix_01/02.sql.
   If those SQL files haven't been run on this branch's Supabase project
   yet, the endpoint will error (missing tables) — handled below with a
   clear "not set up yet" message rather than a cryptic failure. */
let periodsState = { loading:false, periods:null, error:null, actionMsg:null };

async function loadPeriods(){
  periodsState.loading = true; render();
  try{
    const res = await apiFetch(`/api/accounting-periods?branch_id=${state.branchId}`, { method:'GET' });
    const body = await res.json();
    if(!res.ok) throw new Error(body.error || 'Could not load accounting periods.');
    periodsState.periods = body.periods || [];
    periodsState.error = null;
  }catch(e){
    periodsState.error = e.message;
  }
  periodsState.loading = false;
  render();
}
let closePreflightState = { open:false, loading:false, checklist:null, canClose:true, error:null };

async function openClosePreflight(){
  const [start, end] = monthToRange(statementsState.period);
  closePreflightState = { open:true, loading:true, checklist:null, canClose:true, error:null };
  render();
  try{
    const res = await apiFetch(`/api/accounting-periods?action=preflight&branch_id=${state.branchId}&period_start=${start}&period_end=${end}`, { method:'GET' });
    const body = await res.json();
    if(!res.ok) throw new Error(body.error || 'Could not run the pre-close checklist.');
    closePreflightState.checklist = body.checklist;
    closePreflightState.canClose = body.can_close;
  }catch(e){
    closePreflightState.error = e.message;
  }
  closePreflightState.loading = false;
  render();
}
function closeClosePreflight(){ closePreflightState = { open:false, loading:false, checklist:null, canClose:true, error:null }; render(); }
async function confirmClosePeriod(){
  const [start, end] = monthToRange(statementsState.period);
  periodsState.actionMsg = null;
  try{
    const res = await apiFetch('/api/accounting-periods', {
      method:'POST', headers: JSONH,
      body: JSON.stringify({ branch_id: state.branchId, period_start: start, period_end: end })
    });
    const body = await res.json();
    if(!res.ok) throw new Error(body.error || 'Could not close the period.');
    periodsState.actionMsg = { ok:true, text:'Period closed.' };
    closeClosePreflight();
    await loadPeriods();
  }catch(e){
    periodsState.actionMsg = { ok:false, text: e.message };
    closeClosePreflight();
  }
}

async function reopenPeriod(periodId){
  const reason = await promptDialog('Why are you reopening this period? (required, goes on the record)');
  if(!reason || !reason.trim()) return;
  try{
    const res = await apiFetch('/api/accounting-periods', {
      method:'PATCH', headers: JSONH,
      body: JSON.stringify({ branch_id: state.branchId, period_id: periodId, reason: reason.trim() })
    });
    const body = await res.json();
    if(!res.ok) throw new Error(body.error || 'Could not reopen the period.');
    await loadPeriods();
  }catch(e){
    showToast('Could not reopen: ' + e.message, 'error');
  }
}
function monthToRange(period){
  const [y,m] = period.split('-').map(Number);
  const start = `${period}-01`;
  const end = new Date(y, m, 0).toISOString().slice(0,10);
  return [start, end];
}

let statementsState = { loading:false, data:null, error:null, period: new Date().toISOString().slice(0,7), periodType:'month', comparePeriod: null, compareEnabled:false };

// Client-side mirror of financial-statements.js's priorPeriod() — same
// logic, verified there (scripts/verify_period_rollup.js). Duplicated
// intentionally rather than round-tripping to the server just to compute
// what period comes before another.
function priorPeriodClient(period, periodType){
  if(periodType === 'year') return String(Number(period) - 1);
  if(periodType === 'quarter'){
    const [yStr, qStr] = period.split('-Q');
    let y = Number(yStr), q = Number(qStr) - 1;
    if(q < 1){ q = 4; y -= 1; }
    return `${y}-Q${q}`;
  }
  const [y, m] = period.split('-').map(Number);
  const d = new Date(y, m - 2, 1);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}
// A sensible default period value when switching type (e.g. Month -> Quarter).
function defaultPeriodFor(periodType){
  const now = new Date();
  if(periodType === 'year') return String(now.getFullYear());
  if(periodType === 'quarter') return `${now.getFullYear()}-Q${Math.floor(now.getMonth()/3)+1}`;
  return now.toISOString().slice(0,7);
}

async function loadStatements(period, periodType, compareEnabled){
  statementsState = {
    loading:true, data:null, error:null,
    period: period || statementsState.period,
    periodType: periodType || statementsState.periodType,
    compareEnabled: compareEnabled !== undefined ? compareEnabled : statementsState.compareEnabled,
    comparePeriod: null
  };
  consolidatedState = { loading:false, data:null, error:null }; // a new period invalidates any loaded consolidated view
  if(statementsState.compareEnabled){
    statementsState.comparePeriod = priorPeriodClient(statementsState.period, statementsState.periodType);
  }
  render();
  try{
    let url = `/api/financial-statements?branch_id=${state.branchId}&period=${statementsState.period}&period_type=${statementsState.periodType}`;
    if(statementsState.comparePeriod) url += `&compare_period=${statementsState.comparePeriod}`;
    const res = await apiFetch(url, { method:'GET' });
    const body = await res.json();
    if(!res.ok) throw new Error(body.error || 'Could not load financial statements.');
    statementsState.data = body;
  }catch(e){
    statementsState.error = e.message;
  }
  statementsState.loading = false;
  render();
}

let billsState = { loading:false, bills:null, suppliers:null, aging:null, error:null, formError:null, view:'bills', statement:null };

async function loadBills(){
  billsState.loading = true; render();
  try{
    const [billsRes, suppliersRes, agingRes] = await Promise.all([
      apiFetch(`/api/bills?branch_id=${state.branchId}`, { method:'GET' }).then(r=>r.json()),
      apiFetch(`/api/suppliers?branch_id=${state.branchId}`, { method:'GET' }).then(r=>r.json()),
      apiFetch(`/api/bills?branch_id=${state.branchId}&action=aging`, { method:'GET' }).then(r=>r.json())
    ]);
    billsState.bills = billsRes.bills || [];
    billsState.suppliers = suppliersRes.suppliers || [];
    billsState.aging = agingRes.aging || [];
    billsState.error = null;
  }catch(e){
    billsState.error = e.message;
  }
  billsState.loading = false;
  render();
}
async function addSupplier(name, contact, kraPin){
  billsState.formError = null;
  try{
    const res = await apiFetch('/api/suppliers', { method:'POST', headers: JSONH, body: JSON.stringify({ branch_id: state.branchId, name, contact, kra_pin: kraPin || undefined }) });
    const body = await res.json();
    if(!res.ok) throw new Error(body.error || 'Could not add supplier.');
    await loadBills();
  }catch(e){ billsState.formError = e.message; render(); }
}
async function loadSupplierStatement(supplierId){
  try{
    const [stmtRes, docsRes] = await Promise.all([
      apiFetch(`/api/suppliers?action=statement&supplier_id=${supplierId}`, { method:'GET' }).then(r=>r.json()),
      apiFetch(`/api/suppliers?action=documents&supplier_id=${supplierId}`, { method:'GET' }).then(r=>r.json())
    ]);
    const supplier = (billsState.suppliers||[]).find(s=>s.id===supplierId);
    billsState.statement = { supplierId, supplierName: supplier ? supplier.name : '', rows: stmtRes.statement || [], documents: docsRes.documents || [] };
  }catch(e){ billsState.statement = { supplierId, supplierName:'', rows:[], documents:[], error: e.message }; }
  render();
}
async function uploadSupplierDocument(supplierId, file){
  if(!file) return;
  try{
    const dataUrl = await new Promise((res, rej) => {
      const reader = new FileReader();
      reader.onload = () => res(reader.result);
      reader.onerror = () => rej(new Error('Could not read that file.'));
      reader.readAsDataURL(file);
    });

async function payBill(billId, total, outstanding){
  const amountStr = await promptDialog(`Payment amount (KES) — outstanding is ${outstanding}:`, outstanding);

/* ---------------- Reconciliation ---------------- */
let reconcileState = { loading:false, imports:null, current:null, lines:null, suggestions:null, error:null, formError:null };
let statementExtractState = { loading:false, result:null, error:null };

async function extractStatementDocument(file){
  if(!file) return;
  statementExtractState = { loading:true, result:null, error:null };
  render();
  try{
    const dataUrl = await new Promise((res, rej) => {
      const reader = new FileReader();
      reader.onload = () => res(reader.result);
      reader.onerror = () => rej(new Error('Could not read that file.'));
      reader.readAsDataURL(file);
    });
    const base64 = dataUrl.split(',')[1] || '';
    const res = await apiFetch('/api/statement-extraction', {
      method:'POST', headers: JSONH,
      body: JSON.stringify({ branch_id: state.branchId, file_name: file.name, content_type: file.type, data_base64: base64 })
    });
    const body = await res.json();
    if(!res.ok) throw new Error(body.error || 'Could not read this statement.');
    statementExtractState.result = body;
  }catch(e){
    statementExtractState.error = e.message;
  }
  statementExtractState.loading = false;
  render();
}

async function loadImports(){
  reconcileState.loading = true; render();
  try{
    const res = await apiFetch(`/api/reconciliation?branch_id=${state.branchId}`, { method:'GET' });
    const body = await res.json();
    if(!res.ok) throw new Error(body.error || 'Could not load reconciliation imports.');
    reconcileState.imports = body.imports || [];
    reconcileState.error = null;
  }catch(e){ reconcileState.error = e.message; }
  reconcileState.loading = false;
  render();
}
async function openImport(importId){
  reconcileState.loading = true; render();
  try{
    const res = await apiFetch(`/api/reconciliation?import_id=${importId}`, { method:'GET' });
    const body = await res.json();
    if(!res.ok) throw new Error(body.error || 'Could not load this import.');
    reconcileState.current = importId;
    reconcileState.lines = body.lines || [];
    reconcileState.suggestions = body.suggestions || [];
  }catch(e){ reconcileState.error = e.message; }
  reconcileState.loading = false;
  render();
}
function parseStatementText(text){
  // One line per transaction: date,amount,description — matches the same
  // "paste or upload a simple export" pattern as the Tende importer, just
  // simpler since there's no fixed spreadsheet template for a bank/mobile-
  // money statement across providers.
  return text.trim().split('\n').map(line => {
    const [date, amount, ...rest] = line.split(',');
    return { date: (date||'').trim(), amount_kes: Number((amount||'').trim()), description: rest.join(',').trim() };
  }).filter(l => l.date && !isNaN(l.amount_kes) && l.amount_kes !== 0);
}
async function createImport(label, accountName, periodStart, periodEnd, rawText){
  reconcileState.formError = null;
  const lines = parseStatementText(rawText);
  if(lines.length === 0){ reconcileState.formError = 'No valid lines found — each line should be "date,amount,description", one per transaction.'; render(); return; }
  try{
    const res = await apiFetch('/api/reconciliation?action=create', {
      method:'POST', headers: JSONH,
      body: JSON.stringify({ branch_id: state.branchId, label, account_name: accountName, period_start: periodStart, period_end: periodEnd, lines })
    });
    const body = await res.json();
    if(!res.ok) throw new Error(body.error || 'Could not create import.');
    await loadImports();
    await openImport(body.import.id);
  }catch(e){ reconcileState.formError = e.message; render(); }
}
async function resolveLine(lineId, resolution, matchedTxnId){
  try{
    const res = await apiFetch('/api/reconciliation?action=resolve', {
      method:'POST', headers: JSONH,
      body: JSON.stringify({ branch_id: state.branchId, line_id: lineId, resolution, matched_transaction_id: matchedTxnId })
    });
    const body = await res.json();
    if(!res.ok) throw new Error(body.error || 'Could not resolve line.');
    await openImport(reconcileState.current);
  }catch(e){ showToast('Could not resolve: ' + e.message, 'error'); }
}
async function submitImport(){
  try{
    const res = await apiFetch('/api/reconciliation?action=submit', { method:'POST', headers: JSONH, body: JSON.stringify({ branch_id: state.branchId, import_id: reconcileState.current }) });
    const body = await res.json();
    if(!res.ok) throw new Error(body.error || 'Could not submit.');
    await loadImports(); await openImport(reconcileState.current);
  }catch(e){ showToast(e.message, 'error'); }
}
async function approveImport(){
  try{
    const res = await apiFetch('/api/reconciliation?action=approve', { method:'POST', headers: JSONH, body: JSON.stringify({ branch_id: state.branchId, import_id: reconcileState.current }) });
    const body = await res.json();
    if(!res.ok) throw new Error(body.error || 'Could not approve.');

}

async function loadBranchCompare(){
  branchCompareState = { loading:true, rows:null, error:null };
  render();
  try{
    const ym = currentOpenMonth();
    const rows = await Promise.all(state.allBranches.map(async b => {
      const [revRes, expRes] = await Promise.all([
        apiList('/api/revenue', b.branch_id),
        apiList('/api/expenses', b.branch_id)
      ]);
      const revenue = (revRes.revenue||[]).filter(r=>monthKey(r.entry_date)===ym).reduce((s,r)=>s+Number(r.amount_kes),0);
      const expenses = (expRes.expenses||[])
        .filter(e=>monthKey(e.expense_date)===ym && e.status!=='pending_approval' && e.status!=='rejected')
        .reduce((s,e)=>s+Number(e.amount_kes)+Number(e.charges_kes||0),0);
      return { branch_id: b.branch_id, name: b.name, revenue, expenses };
    }));
    branchCompareState = { loading:false, rows, error:null };
  }catch(e){
    branchCompareState = { loading:false, rows:null, error:e.message };
  }
  render();
}

let chartRefs = {};
function drawArchiveCharts(){
  const rows = state.monthlyArchive.slice().sort((a,b)=>a.month<b.month?-1:1);
  const labels = rows.map(r=>r.month_label);
  Object.values(chartRefs).forEach(c=>c && c.destroy());
  if(!window.Chart || rows.length===0){ chartRefs={}; return; }
  const inkSoft = '#3B4B63', gold='#D9A441', good='#2F7A5C';
  chartRefs.revOpex = new Chart(document.getElementById('chart-rev-opex'), {
    type:'bar',
    data:{labels, datasets:[
      {label:'Revenue', data:rows.map(r=>r.total_revenue_kes), backgroundColor:gold},

    const p = Number(fdata.get('pct_profit')), o=Number(fdata.get('pct_owner_debt')), t=Number(fdata.get('pct_tax')), x=Number(fdata.get('pct_opex'));
    const errEl = document.getElementById('settings-err');
    if(Math.round((p+o+t+x)*100)/100 !== 100){ errEl.innerHTML = `<div class="err-msg">Percentages must sum to exactly 100% (currently ${p+o+t+x}%).</div>`; return; }
    state.settings.pct_profit=p; state.settings.pct_owner_debt=o; state.settings.pct_tax=t; state.settings.pct_opex=x;
    state.settings.debt_paydown_split_pct = Number(fdata.get('debt_paydown_split_pct'));
    state.settings.monthly_revenue_target_kes = Number(fdata.get('monthly_revenue_target_kes'));
    state.settings.opening_opex_account_balance_kes = Number(fdata.get('opening_opex_account_balance_kes'));
    queueSave(); render();
  });
  document.querySelectorAll('[data-del-category]').forEach(b=>b.addEventListener('click',()=>{
    const name = b.dataset.delCategory;
    if(state.expenses.some(e=>e.category===name)){
      showToast(`Can't remove "${name}" — it's used by existing expenses. Recategorize those first.`, 'error');
      return;
    }
    state.categories = CATS().filter(c=>c!==name);
    queueSave(); render();
  }));
  const addCatSettings = document.getElementById('btn-add-category-settings');
  if(addCatSettings) addCatSettings.addEventListener('click', async ()=>{
    const name = ((await promptDialog('New expense category name:'))||'').trim();
    if(!name) return;
    if(!state.categories) state.categories = DEFAULT_CATEGORIES.slice();
    if(!state.categories.some(c=>c.toLowerCase()===name.toLowerCase())) state.categories.push(name);
    queueSave(); render();
  });
  const btnExport = document.getElementById('btn-export');
  if(btnExport) btnExport.addEventListener('click', ()=>{
    const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'happynet-export.json'; a.click();
    URL.revokeObjectURL(url);
  });
}

let recoveryToken = null; // set when a password-recovery link brought the person here

function renderRecovery(){

            ${recoveryMsg && !recoveryMsg.ok ? `<div class="err-msg" style="margin-top:12px;">${recoveryMsg.text}</div>` : ''}
          </form>
          `}
        </div>
      </div>
    </div>`;

  if(formRecovery) formRecovery.addEventListener('submit', async e=>{
    e.preventDefault();
    const fd = new FormData(formRecovery);
    const password = fd.get('password'), confirm = fd.get('confirm');
    if(password !== confirm){ recoveryMsg = { ok:false, text:"Passwords don't match." }; renderRecovery(); return; }
    const submitBtn = formRecovery.querySelector('button[type=submit]');
    submitBtn.disabled = true; submitBtn.innerHTML = 'Updating…';
    try{
      const res = await fetch('/api/password-update', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ access_token: recoveryToken, new_password: password })
      });
      const body = await res.json();
      if(!res.ok) throw new Error(body.error || 'Could not update the password.');
      recoveryMsg = { ok:true };
      renderRecovery();

      renderRecovery();
    }

  if(toSignin) toSignin.addEventListener('click', ()=>{
    recoveryToken = null; recoveryMsg = null;
    renderLogin();
  });

async function startApp(){
  const s = getSession();
  if(!s){ renderLogin(); return; }
  currentUserEmail = s.user ? s.user.email : '';
  root().innerHTML = `<div class="loading-screen">Loading Happynet…</div>`;
  try{
    await loadState();
  }catch(e){
    renderLogin(e.message || 'Your session expired — please sign in again.');
    return;
  }
  render();
  loadAlerts(); // default tab is Dashboard, which shows alerts — load once on boot
  checkSyncHealth(); // silent Head-Office-only check; surfaces as a sidebar badge only if something's actually wrong
}

// Last-resort safety net for anything that slips past the specific
// try/catch blocks already in each async function — never meant to
// replace those (they give a much more specific, useful message), just a
// backstop so a genuinely unanticipated bug surfaces as a toast instead
// of failing completely silently.
window.addEventListener('error', (e)=>{
  console.error('Uncaught error:', e.error || e.message);
});
window.addEventListener('unhandledrejection', (e)=>{
  console.error('Unhandled promise rejection:', e.reason);
  if(typeof showToast === 'function'){
    showToast('Something unexpected went wrong: ' + (e.reason && e.reason.message ? e.reason.message : 'please try again.'), 'error');
  }
});

(async function boot(){
  // Both password-recovery and signup-confirmation links land here with
  // tokens in the URL fragment — Supabase's own hosted verification
  // already confirmed the link is genuine before handing back the token.
  const hash = window.location.hash;
  if(hash && hash.includes('access_token=')){
    const params = new URLSearchParams(hash.slice(1));
    const token = params.get('access_token');
    const refreshToken = params.get('refresh_token');
    const type = params.get('type');
    history.replaceState(null, '', window.location.pathname + window.location.search); // scrub tokens from the visible URL/history
    if(type === 'recovery' && token){
      recoveryToken = token;
      renderRecovery();
      return;
    }
    if(token && refreshToken){
      // A signup-confirmation link (or any other flow handing back a
      // ready session) — sign them straight in rather than making a
      // freshly-confirmed person land back at a bare login form.
      const expiresAt = Number(params.get('expires_at')) || (Math.floor(Date.now()/1000) + 3600);
      setSession({ access_token: token, refresh_token: refreshToken, expires_at: expiresAt, user: {} }, true);
      await startApp();
      return;
    }
  }
  const s = getSession();
  if(s){ await startApp(); } else { renderLogin(); }
})();
