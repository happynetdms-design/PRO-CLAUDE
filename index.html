<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Happynet — Profit First Dashboard</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --ink:#132339;
  --ink-soft:#3B4B63;
  --paper:#F5F1E7;
  --card:#FFFDF8;
  --gold:#D9A441;
  --gold-deep:#B9822B;
  --good:#2F7A5C;
  --good-soft:#E4EFE8;
  --alert:#B23A2E;
  --alert-soft:#F5E4E1;
  --hair:#DED5C0;
  --muted:#7A7261;
  --text:var(--ink);
  --neutral-soft:var(--neutral-soft);
  --tone-gold-soft:var(--tone-gold-soft);
  --tone-navy-soft:var(--tone-navy-soft);
  --radius:14px;
  --shadow:0 1px 2px rgba(19,35,57,.04), 0 6px 20px rgba(19,35,59,.06);
}
/* Dark mode — only the "light surface" variables change. --ink stays
   fixed: it's the brand navy used for permanently-dark elements (sidebar,
   buttons on gold, the narrative card) that were never meant to invert.
   --text/--ink-soft are the ones that adapt, since those are what body
   copy and secondary text actually read from. */
html[data-theme="dark"]{
  --paper:#0F1B2C;
  --card:#16243A;
  --hair:#2A3B54;
  --muted:#93A0B5;
  --text:#EDE7D8;
  --ink-soft:#C7CEDB;
  --good:#4CAF7D;
  --good-soft:#16342A;
  --alert:#E07A6D;
  --alert-soft:#3A1F1C;
  --neutral-soft:#22334C;
  --tone-gold-soft:#3A2E1A;
  --tone-navy-soft:#1E2B42;
  --shadow:0 1px 2px rgba(0,0,0,.25), 0 6px 20px rgba(0,0,0,.35);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--text);
  font-family:'Inter',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
.num{font-family:'IBM Plex Mono',monospace; font-weight:500; letter-spacing:-0.01em;}
h1,h2,h3,.display{font-family:'Fraunces',serif;}
.app{display:flex; min-height:100vh;}

/* --- Sidebar --- */
.sidebar{
  width:240px; flex-shrink:0; background:var(--ink); color:#EFE9DA;
  display:flex; flex-direction:column; padding:22px 16px;
  position:sticky; top:0; height:100vh; overflow-y:auto;
  border-right:1px solid rgba(217,164,65,.12);
}
.sidebar::-webkit-scrollbar{width:5px;}
.sidebar::-webkit-scrollbar-track{background:transparent;}
.sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15); border-radius:4px;}
.sidebar::-webkit-scrollbar-thumb:hover{background:var(--gold);}
.nav-section{display:flex; flex-direction:column; gap:3px; padding-bottom:6px;}
.nav-section:not(:last-child){border-bottom:1px solid rgba(255,255,255,.08); margin-bottom:6px;}
.nav-section-label{font-size:11px; font-weight:700; color:#8C93A6; text-transform:uppercase; letter-spacing:.06em; padding:8px 12px 4px;}
.toast-stack{position:fixed; bottom:20px; right:20px; z-index:200; display:flex; flex-direction:column; gap:8px; max-width:360px;}
.toast{background:var(--card); color:var(--text); border:1px solid var(--hair); border-radius:10px; padding:12px 14px; box-shadow:var(--shadow); display:flex; align-items:center; justify-content:space-between; gap:12px; font-size:13.5px; animation:toast-in .18s ease-out;}
.toast-error{border-left:4px solid var(--alert);}
.toast-success{border-left:4px solid var(--good);}
.toast-info{border-left:4px solid var(--gold);}
.toast button{all:unset; cursor:pointer; color:var(--muted); font-size:16px; line-height:1; padding:2px;}
.toast button:hover{color:var(--text);}
@keyframes toast-in{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}
.brand{display:flex; align-items:center; gap:11px; padding:4px 6px 24px;}
.brand-mark{
  width:34px; height:34px; border-radius:10px; flex-shrink:0;
  background:linear-gradient(155deg, var(--gold) 0%, var(--gold-deep) 100%);
  color:var(--ink); display:flex; align-items:center; justify-content:center;
  box-shadow:0 4px 10px rgba(217,164,65,.25);
}
.brand-text{font-family:'Fraunces',serif; font-weight:600; font-size:17px; line-height:1.1; color:#fff;}
.brand-text .accent{color:var(--gold);}
.brand-text .sublabel{display:block; font-family:'Inter'; font-weight:600; font-size:9.5px; letter-spacing:.14em; color:#8C93A6; text-transform:uppercase; margin-top:3px;}
.branch-switch{padding:0 2px 16px;}
.branch-switch select{
  width:100%; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12); color:#EFE9DA;
  border-radius:9px; padding:9px 10px; font-size:12.5px; font-weight:600; font-family:'Inter'; cursor:pointer;
}
.branch-switch select:focus{outline:1px solid var(--gold);}
nav{display:flex; flex-direction:column; gap:2px;}
nav button{
  all:unset; cursor:pointer; padding:10px 12px; border-radius:10px; font-size:13.5px;
  color:#B9C0D1; font-weight:500; display:flex; align-items:center; gap:11px;
  transition:background .15s, color .15s;
}
nav button svg{opacity:.75; transition:opacity .15s;}
nav button:hover{background:rgba(255,255,255,.06); color:#fff;}
nav button:focus-visible{outline:2px solid var(--gold); outline-offset:-2px; background:rgba(255,255,255,.06); color:#fff;}
.btn:focus-visible{outline:2px solid var(--gold); outline-offset:2px;}
.sidebar-foot button:focus-visible{outline:2px solid var(--gold); outline-offset:1px; border-radius:6px;}
#btn-open-palette:focus-visible{outline:2px solid var(--gold); outline-offset:1px;}
.mobile-tabs button:focus-visible{outline:2px solid var(--gold); outline-offset:-2px;}
nav button:hover svg{opacity:1;}
nav button.active{background:var(--gold); color:var(--ink); font-weight:600;}
nav button.active svg{opacity:1;}

.sidebar-widget{margin:20px 2px 0; padding:14px 14px 15px; background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.08); border-radius:12px;}
.sidebar-widget-head{display:flex; justify-content:space-between; align-items:center; font-size:11.5px; font-weight:600; color:#D8D1BE; margin-bottom:11px;}
.mini-progress-row{display:flex; justify-content:space-between; font-size:11px; color:#9AA2B4; margin-bottom:4px;}
.mini-progress-row b{color:#EFE9DA; font-family:'IBM Plex Mono',monospace; font-weight:600;}
.mini-progress-track{height:5px; border-radius:3px; background:rgba(255,255,255,.09); overflow:hidden;}
.mini-progress-fill{height:100%; border-radius:3px;}

.sidebar-foot{margin-top:auto; padding-top:16px;}
.profile-chip{
  display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:11px;
  border:1px solid rgba(255,255,255,.08); margin-top:8px;
}
.profile-avatar{
  width:32px; height:32px; border-radius:50%; background:var(--gold); color:var(--ink); flex-shrink:0;
  display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; font-family:'Fraunces',serif;
}
.profile-info{flex:1; min-width:0;}
.profile-email{font-size:11.5px; color:#EFE9DA; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.profile-role{font-size:10px; color:#8C93A6; text-transform:capitalize; margin-top:1px;}
.sidebar-foot button{all:unset; cursor:pointer; color:#8C93A6; display:flex; padding:4px; border-radius:6px; transition:color .15s, background .15s;}
.sidebar-foot button:hover{color:#fff; background:rgba(255,255,255,.08);}

/* --- Main --- */
.main{flex:1; min-width:0; padding:30px 38px 80px; max-width:1220px;}
.topbar{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:28px; gap:16px; flex-wrap:wrap;
  padding-bottom:20px; border-bottom:1px solid var(--hair);}
.topbar h1{font-size:27px; margin:0 0 4px; font-weight:600;}
.topbar .sub{color:var(--muted); font-size:13.5px;}
.topbar-actions{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
.month-pill{
  background:var(--card); border:1px solid var(--hair); border-radius:100px; padding:7px 16px 7px 8px;
  font-size:13px; font-weight:600; color:var(--ink-soft); display:flex; align-items:center; gap:8px;
}
.month-pill .dot{width:26px; height:26px; border-radius:50%; background:var(--good-soft); color:var(--good); display:flex; align-items:center; justify-content:center;}
.month-pill.closed .dot{background:var(--neutral-soft); color:var(--muted);}

/* --- Cards / grid --- */
.grid{display:grid; gap:16px;}
.grid.kpi{grid-template-columns:repeat(auto-fit, minmax(240px,1fr));}
.card{
  background:var(--card); border:1px solid var(--hair); border-radius:var(--radius);
  padding:19px 21px; box-shadow:var(--shadow); transition:box-shadow .18s, transform .18s;
}
.card.kpi{position:relative; overflow:hidden;}
.card.kpi:hover{box-shadow:0 2px 4px rgba(19,35,57,.05), 0 14px 28px rgba(19,35,57,.09); transform:translateY(-1px);}
.card h3{margin:0 0 4px; font-size:12.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:600; font-family:'Inter';}
.kpi-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:2px;}
.kpi-icon{
  width:32px; height:32px; border-radius:9px; display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.kpi-icon.tone-gold{background:var(--tone-gold-soft); color:var(--gold-deep);}
.kpi-icon.tone-navy{background:var(--tone-navy-soft); color:var(--ink-soft);}
.kpi-icon.tone-good{background:var(--good-soft); color:var(--good);}
.kpi .big{font-family:'IBM Plex Mono',monospace; font-size:29px; font-weight:600; margin:6px 0 6px; line-height:1;}
.kpi .foot{font-size:12.5px; color:var(--muted); line-height:1.5;}
.tag{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; padding:3px 9px; border-radius:100px;}
.tag.good{background:var(--good-soft); color:var(--good);}
.tag.alert{background:var(--alert-soft); color:var(--alert);}
.tag.neutral{background:var(--neutral-soft); color:var(--ink-soft);}

/* signal bars — signature element */
.signal{display:flex; align-items:flex-end; gap:3px; height:22px;}
.signal i{width:5px; border-radius:1.5px; background:var(--hair); display:block;}
.signal i:nth-child(1){height:7px;} .signal i:nth-child(2){height:12px;}
.signal i:nth-child(3){height:17px;} .signal i:nth-child(4){height:22px;}
.signal.lit-1 i:nth-child(1){background:var(--alert);}
.signal.lit-2 i:nth-child(-n+2){background:var(--gold);}
.signal.lit-3 i:nth-child(-n+3){background:var(--gold);}
.signal.lit-4 i{background:var(--good);}

.narrative{
  position:relative; background:var(--ink); color:#EDE7D6; border-radius:var(--radius); padding:24px 26px 24px 62px;
  font-family:'Fraunces',serif; font-size:16.5px; line-height:1.6; font-weight:400; overflow:hidden;
}
.narrative::before{
  content:''; position:absolute; inset:0;
  background:radial-gradient(ellipse 320px 200px at 100% 0%, rgba(217,164,65,.14), transparent 60%);
}
.narrative-icon{
  position:absolute; left:24px; top:24px; width:28px; height:28px; border-radius:8px;
  background:rgba(217,164,65,.16); color:var(--gold); display:flex; align-items:center; justify-content:center;
}
.narrative b{color:var(--gold); font-weight:600;}

/* --- Tables --- */
.table-wrap{background:var(--card); border:1px solid var(--hair); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow);}
table{width:100%; border-collapse:collapse; font-size:13.5px;}
thead th{
  text-align:left; padding:11px 14px; background:var(--neutral-soft); color:var(--ink-soft);
  font-size:11px; text-transform:uppercase; letter-spacing:.05em; font-weight:600; border-bottom:1px solid var(--hair);
}
tbody td{padding:10px 14px; border-bottom:1px solid #EFEADC; font-family:'IBM Plex Mono',monospace; font-size:13px;}
tbody td.txt{font-family:'Inter'; font-size:13.5px;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:var(--paper);}
.neg{color:var(--alert); font-weight:600;}
.pos{color:var(--good); font-weight:600;}
.empty-row td{color:var(--muted); font-style:italic; font-family:'Inter'; text-align:center; padding:22px;}

/* --- Forms --- */
.form-card{background:var(--card); border:1px solid var(--hair); border-radius:var(--radius); padding:20px 22px; box-shadow:var(--shadow); margin-bottom:18px;}
.form-card h3{margin:0 0 14px; font-size:15px;}
.form-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:12px;}
label{display:block; font-size:11.5px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; margin-bottom:5px;}
input,select,textarea{
  width:100%; border:1px solid var(--hair); background:var(--card); border-radius:8px; padding:9px 11px;
  font-family:'Inter'; font-size:13.5px; color:var(--text); outline:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--gold); box-shadow:0 0 0 3px rgba(217,164,65,.18);}
input[type=checkbox]{width:auto; accent-color:var(--gold-deep);}
.check-row{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--ink-soft);}
.btn{
  all:unset; cursor:pointer; background:var(--ink); color:#F5F1E7; font-weight:600; font-size:13.5px;
  padding:10px 18px; border-radius:9px; display:inline-flex; align-items:center; gap:6px; transition:opacity .15s;
}
.btn:hover{opacity:.85;}
.btn:disabled,.btn[disabled]{opacity:.4; cursor:not-allowed; pointer-events:none;}
.btn:disabled:hover,.btn[disabled]:hover{opacity:.4;}
.btn.gold{background:var(--gold); color:var(--ink);}
.btn.ghost{background:transparent; border:1px solid var(--hair); color:var(--ink-soft);}
.btn.danger{background:var(--alert); color:#fff;}
.btn.sm{padding:6px 12px; font-size:12.5px;}
.err-msg{background:var(--alert-soft); color:var(--alert); border-radius:8px; padding:9px 13px; font-size:13px; margin-top:10px; font-weight:500;}
.hint{font-size:12px; color:var(--muted); margin-top:4px;}
.import-summary{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;}

.section-head{display:flex; justify-content:space-between; align-items:center; margin:26px 0 12px;}
.section-head:first-of-type{margin-top:0;}
.section-head h2{font-size:16.5px; margin:0; font-weight:600; color:var(--ink-soft); font-family:'Inter';}
.toolbar{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
.toolbar select,.toolbar input{width:auto; padding:7px 10px; font-size:12.5px;}

.filters{display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap;}
.summary-strip{display:flex; gap:22px; padding:14px 20px; background:var(--neutral-soft); border-radius:var(--radius); margin-bottom:14px; flex-wrap:wrap;}
.summary-strip .item{display:flex; flex-direction:column; gap:2px;}
.summary-strip .item span{font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:600;}
.summary-strip .item b{font-family:'IBM Plex Mono',monospace; font-size:16px;}

.modal-backdrop{position:fixed; inset:0; background:rgba(19,35,57,.55); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;}
.modal{background:var(--card); border-radius:var(--radius); padding:26px 28px; max-width:480px; width:100%; box-shadow:0 20px 60px rgba(0,0,0,.3);}
.modal h3{margin-top:0;}
.modal .totals{background:var(--neutral-soft); border-radius:10px; padding:14px 16px; margin:14px 0; font-size:13.5px;}
.modal .totals div{display:flex; justify-content:space-between; padding:3px 0;}
.modal-actions{display:flex; gap:10px; justify-content:flex-end; margin-top:16px;}

.chart-box{background:var(--card); border:1px solid var(--hair); border-radius:var(--radius); padding:18px 20px; box-shadow:var(--shadow); margin-bottom:16px;}
.chart-box h3{font-size:13px; margin:0 0 12px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em;}
.chart-canvas-wrap{height:220px; position:relative;}

.mobile-tabs{display:none;}
@media (max-width: 880px){
  .sidebar{display:none;}
  .main{padding:18px 16px 90px;}
  .mobile-tabs{
    display:flex; position:fixed; bottom:0; left:0; right:0; background:var(--ink); z-index:50;
    padding:6px 4px calc(6px + env(safe-area-inset-bottom)); overflow-x:auto; gap:2px;
  }
  .mobile-tabs button{
    all:unset; flex:1; min-width:64px; text-align:center; color:#B7AE99; font-size:10.5px; font-weight:600;
    padding:8px 4px; border-radius:8px; cursor:pointer;
  }
  .mobile-tabs button.active{background:var(--gold); color:var(--ink);}
  .form-row{grid-template-columns:1fr 1fr;}
}
@media (max-width:520px){
  .form-row{grid-template-columns:1fr;}
  .topbar{flex-direction:column;}
}
.quick-fab{display:none;}

::-webkit-scrollbar{width:10px; height:10px;}
::-webkit-scrollbar-thumb{background:var(--hair); border-radius:6px;}

.pf-bucket-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px; margin-top:14px;}
.pf-bucket{padding:16px 17px; border-radius:12px; background:var(--card); border:1px solid var(--hair); box-shadow:var(--shadow); position:relative; overflow:hidden;}
.pf-bucket::before{content:''; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--tone,var(--gold));}
.pf-bucket-icon{width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; margin-bottom:10px; background:color-mix(in srgb, var(--tone,var(--gold)) 16%, transparent); color:var(--tone,var(--gold-deep));}
.pf-bucket .label{font-size:11.5px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.04em;}
.pf-bucket .amt{font-family:'IBM Plex Mono',monospace; font-size:19px; font-weight:600; margin-top:5px;}

.loading-screen{display:flex; align-items:center; justify-content:center; height:100vh; color:var(--muted); font-family:'Fraunces',serif; font-size:15px;}

/* --- Login (split screen) --- */
.login-wrap{min-height:100vh; display:flex; background:var(--ink);}
.login-hero{
  flex:1 1 54%; position:relative; overflow:hidden; padding:56px 60px;
  display:flex; flex-direction:column; justify-content:space-between;
  background:
    radial-gradient(ellipse 620px 480px at 4% -6%, rgba(217,164,65,.20), transparent 60%),
    linear-gradient(160deg, #0F2038 0%, #0B1830 55%, #0A1526 100%);
  color:#F2EFE4;
}
.login-hero-rings{position:absolute; left:-160px; bottom:-160px; width:520px; height:520px;
  border-radius:50%; border:1px solid rgba(217,164,65,.16); pointer-events:none;}
.login-hero-rings::before{content:''; position:absolute; inset:60px; border-radius:50%; border:1px solid rgba(217,164,65,.12);}
.login-hero-rings::after{content:''; position:absolute; inset:120px; border-radius:50%; border:1px solid rgba(217,164,65,.10);}

.login-logo{display:flex; align-items:center; gap:12px; position:relative; z-index:1;}
.login-logo-mark{font-size:30px; line-height:1;}
.login-logo-word{font-family:'Fraunces',serif; font-weight:700; font-size:26px; letter-spacing:-.01em;}
.login-logo-word b{color:var(--gold); font-weight:700;}
.login-logo-sub{display:flex; align-items:center; gap:10px; margin-top:6px;}
.login-logo-sub span{font-size:11px; letter-spacing:.22em; color:#B7AE99; font-weight:600;}
.login-logo-sub i{display:block; width:26px; height:1px; background:var(--gold-deep);}

.login-hero-mid{position:relative; z-index:1; margin:44px 0 0;}
.login-headline{font-family:'Fraunces',serif; font-weight:600; font-size:clamp(30px,3.6vw,42px); line-height:1.12; margin:0 0 16px;}
.login-headline i{display:block; width:52px; height:3px; background:var(--gold); border-radius:2px; margin:16px 0 18px;}
.login-hero-sub{font-size:15px; line-height:1.6; color:#C9C2AE; max-width:400px; margin:0 0 34px;}

.login-features{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; max-width:520px;}
.login-feature{display:flex; flex-direction:column; align-items:flex-start; gap:10px;}
.login-feature-icon{
  width:52px; height:52px; border-radius:13px; display:flex; align-items:center; justify-content:center;
  background:rgba(217,164,65,.10); border:1px solid rgba(217,164,65,.28);
}
.login-feature-icon svg{width:22px; height:22px;}
.login-feature span{font-size:12.5px; font-weight:600; color:#E7E2D2; line-height:1.3;}

.login-hero-chart{position:relative; z-index:1; height:120px; margin-top:36px;}
.login-security{
  position:relative; z-index:1; margin-top:18px; display:flex; align-items:center; gap:12px;
  background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.10); border-radius:12px;
  padding:12px 16px; max-width:420px; backdrop-filter:blur(2px);
}
.login-security-icon{
  width:34px; height:34px; border-radius:50%; background:var(--ink); border:1px solid var(--gold-deep);
  display:flex; align-items:center; justify-content:center; flex-shrink:0;

/* ---------------- Theme (dark mode) ---------------- */
const THEME_KEY = 'happynet_theme';
function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme === 'dark' ? 'dark' : 'light');
}
function getPreferredTheme(){
  const saved = localStorage.getItem(THEME_KEY);
  if(saved === 'dark' || saved === 'light') return saved;
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
function toggleTheme(){
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  localStorage.setItem(THEME_KEY, next);
  applyTheme(next);
  render(); // re-render so the toggle icon itself flips too
}
applyTheme(getPreferredTheme()); // set immediately on script load, before any render — no flash of the wrong theme

/* ---------------- API layer (talks to Netlify Functions only) ---------------- */
const SESSION_KEY = 'happynet_session';

// "Remember me" controls WHICH storage the session lives in — checked (the
// default) persists across browser restarts via localStorage, same as
// before; unchecked uses sessionStorage instead, so closing the browser
// tab ends the session. getSession() checks sessionStorage first since
// that's where an unchecked "remember me" session would be.
function getSession(){
  try{
    const fromSession = sessionStorage.getItem(SESSION_KEY);
    if(fromSession) return JSON.parse(fromSession);
    return JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
  }catch(e){ return null; }
}
function setSession(s, remember){
  // remember defaults to true when unspecified, e.g. on token refresh,
  // where we want to keep using whichever storage the session already
  // lives in rather than silently changing it — so refresh re-detects
  // the existing location first.
  if(remember === undefined){
    remember = !sessionStorage.getItem(SESSION_KEY);
  }
  if(s){
    if(remember){ localStorage.setItem(SESSION_KEY, JSON.stringify(s)); sessionStorage.removeItem(SESSION_KEY); }
    else { sessionStorage.setItem(SESSION_KEY, JSON.stringify(s)); localStorage.removeItem(SESSION_KEY); }
  } else {
    localStorage.removeItem(SESSION_KEY);
    sessionStorage.removeItem(SESSION_KEY);
  }
}

async function apiLogin(email, password, remember){
  const res = await fetch('/api/login', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ email, password })
  });
  const body = await res.json();
  if(!res.ok) throw new Error(body.error || 'Sign in failed.');
  setSession(body, remember);
  return body;
}

async function apiRefresh(){
  const s = getSession();
  if(!s || !s.refresh_token) return false;
  try{
    const res = await fetch('/api/refresh', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ refresh_token: s.refresh_token })
    });
    if(!res.ok) { setSession(null); return false; }
    const body = await res.json();
    setSession(body);
    return true;
  }catch(e){ return false; }
}

async function apiLogout(){
  const s = getSession();
  try{
    await fetch('/api/logout', {
      method:'POST', headers:{'Authorization':'Bearer '+(s ? s.access_token : '')}
    });
  }catch(e){ /* ignore — clear local session regardless */ }
  setSession(null);
}

// Wraps fetch to /api/*: attaches the bearer token and retries once after a
// silent refresh if the token turned out to be expired.
async function apiFetch(path, options={}, _retried){
  const s = getSession();
  const headers = Object.assign({}, options.headers, { 'Authorization':'Bearer '+(s ? s.access_token : '') });
  const res = await fetch(path, Object.assign({}, options, { headers }));
  if(res.status === 401 && !_retried){
    const refreshed = await apiRefresh();
    if(refreshed) return apiFetch(path, options, true);
  }
  return res;
}

async function apiGetState(){
  const res = await apiFetch('/api/state', { method:'GET' });
  if(!res.ok) throw new Error('unauthorized');
  const body = await res.json();
  return body.data || {};
}

async function apiSaveState(data){
  const res = await apiFetch('/api/state', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ data })
  });
  if(!res.ok) throw new Error('save failed');
  return true;
}

// Per-branch home for categories/monthlyArchive/closedMonths — see
// supabase/branch_misc_state.sql for why this exists separately from
// apiGetState()/apiSaveState() above, which still hit the old single-row
// /api/state purely as a whole-app mirror/rollback point.
async function apiGetBranchMisc(branchId){
  const res = await apiFetch('/api/branch-state?branch_id=' + branchId, { method:'GET' });
  if(!res.ok) throw new Error('Could not load branch data.');
  const body = await res.json();
  return body.data || {};
}
async function apiSaveBranchMisc(branchId, data){
  const res = await apiFetch('/api/branch-state', {
    method:'POST', headers: JSONH,
    body: JSON.stringify({ branch_id: branchId, data })
  });
  if(!res.ok) throw new Error('Could not save branch data.');
  return true;
}

  return res.json();
}

const JSONH = { 'Content-Type':'application/json' };

async function apiList(path, branchId, extraQuery){
  const qs = new URLSearchParams(Object.assign({ branch_id: branchId }, extraQuery||{}));
  const res = await apiFetch(path + '?' + qs.toString(), { method:'GET' });
  if(!res.ok) throw new Error('Failed to load ' + path);
  return res.json();
}
async function apiCreate(path, body){
  const res = await apiFetch(path, { method:'POST', headers: JSONH, body: JSON.stringify(body) });
  if(!res.ok){ const b = await res.json().catch(()=>({})); throw new Error(b.error || ('Create failed: ' + path)); }
  return res.json();
}
async function apiUpdate(path, body){
  const res = await apiFetch(path, { method:'PATCH', headers: JSONH, body: JSON.stringify(body) });
  if(!res.ok){ const b = await res.json().catch(()=>({})); throw new Error(b.error || ('Update failed: ' + path)); }
  return res.json();
}
async function apiRemove(path, body){
  const res = await apiFetch(path, { method:'DELETE', headers: JSONH, body: JSON.stringify(body) });
  if(!res.ok){ const b = await res.json().catch(()=>({})); throw new Error(b.error || ('Delete failed: ' + path)); }
  return res.json();
}
async function apiPutSettings(body){
  const res = await apiFetch('/api/settings', { method:'PUT', headers: JSONH, body: JSON.stringify(body) });
  if(!res.ok){ const b = await res.json().catch(()=>({})); throw new Error(b.error || 'Settings update failed'); }

/* ---------------- CSV export (Phase 5) ---------------- */
function csvEscape(v){
  const s = v===null||v===undefined ? '' : String(v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
}
function toCsv(headers, rows){
  const lines = [headers.map(csvEscape).join(',')];
  for(const row of rows) lines.push(row.map(csvEscape).join(','));
  return lines.join('\r\n');
}
function downloadText(filename, text, mime){
  const blob = new Blob([text], { type: mime || 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
// For server-generated downloads (PDF/xls export) — plain <a href> links
// can't carry this app's Bearer auth token, so these go through apiFetch
// (which attaches it) and trigger the download from the resulting blob.
async function downloadViaApi(path, filename){
  try{
    const res = await apiFetch(path, { method:'GET' });
    if(!res.ok){ const body = await res.json().catch(()=>({})); throw new Error(body.error || 'Export failed.'); }
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }catch(e){ showToast('Export failed: ' + e.message, 'error'); }
}

async function uploadAttachment(entityType, entityId, file){
  if(!file) return;
  const dataUrl = await new Promise((res, rej) => {
    const reader = new FileReader();
    reader.onload = () => res(reader.result);
    reader.onerror = () => rej(new Error('Could not read that file.'));
    reader.readAsDataURL(file);
  });
  const base64 = dataUrl.split(',')[1] || '';
  attachmentsState.loading = true; render();
  try{
    await apiCreate('/api/attachments', {
      branch_id: state.branchId, entity_type: entityType, entity_id: entityId,
      file_name: file.name, content_type: file.type || 'application/octet-stream', data_base64: base64
    });
    await openAttachments(entityType, entityId); // refresh the list with the new file included
  }catch(e){
    attachmentsState.loading = false;
    attachmentsState.error = e.message;
    render();
  }
}

  attachmentsState.loading = true; render();

  }catch(e){
    attachmentsState.loading = false;
    attachmentsState.error = e.message;

  const closeBtn = document.querySelector('[data-close-attachments]');

// actual data (see netlify/functions/ai-assistant.js) — nothing here sends
// raw financial records to the model from the browser, only the question
// and a short rolling history for follow-up context.

let docIntelState = { loading:false, result:null, error:null, context:null };

// context: 'expense' | 'bill' — keeps a receipt extracted while on one
// form from ever showing up pre-filling the other after switching tabs.
async function extractFromReceipt(file, context){
  if(!file) return;
  docIntelState = { loading:true, result:null, error:null, context };
  render();
  try{
    const dataUrl = await new Promise((res, rej) => {
      const reader = new FileReader();
      reader.onload = () => res(reader.result);
      reader.onerror = () => rej(new Error('Could not read that file.'));
      reader.readAsDataURL(file);
    });
    const base64 = dataUrl.split(',')[1] || '';
    const res = await apiFetch('/api/document-intelligence', {
      method:'POST', headers: JSONH,
      body: JSON.stringify({ branch_id: state.branchId, file_name: file.name, content_type: file.type || 'image/jpeg', data_base64: base64, document_type: context === 'bill' ? 'invoice' : 'receipt' })
    });
    const body = await res.json();
    if(!res.ok) throw new Error(body.error || 'Could not read this document.');
    docIntelState.result = body;
  }catch(e){
    docIntelState.error = e.message;
  }
  docIntelState.loading = false;
  render();
}
// Best-effort: does the extracted vendor name match an existing supplier?
// Never auto-creates a supplier from an OCR guess — just pre-selects one
// if there's a confident match, otherwise leaves it for the person to pick
// or add.
function matchSupplierByName(vendorName, suppliers){
  if(!vendorName || !suppliers) return null;
  const v = vendorName.toLowerCase().trim();
  const exact = suppliers.find(s => s.name.toLowerCase().trim() === v);
  if(exact) return exact.id;
  const partial = suppliers.find(s => v.includes(s.name.toLowerCase().trim()) || s.name.toLowerCase().includes(v));
  return partial ? partial.id : null;
}
// Only returns an extraction if it was made for THIS form — switching
// tabs after extracting on one form never leaks a stale result into the
// other's fields.
function docIntelExtractedFor(context){
  return docIntelState.context === context ? (docIntelState.result?.extracted || null) : null;
}

async function askAssistant(question){
  assistantMessages.push({ role:'user', content: question });
  assistantLoading = true; assistantError = null; render();
  try{
    const res = await apiFetch('/api/ai-assistant', {
      method:'POST', headers: JSONH,
      body: JSON.stringify({
        branch_id: state.branchId, question,
        history: assistantMessages.slice(-13, -1), // exclude the question just pushed; server also caps this
        conversation_id: assistantConversationId
      })
    });
    const body = await res.json();
    if(!res.ok) throw new Error(body.error || 'The assistant could not answer that.');
    assistantMessages.push({ role:'assistant', content: body.answer });
    if(body.conversation_id) assistantConversationId = body.conversation_id;
  }catch(e){
    assistantError = e.message;
  }
  assistantLoading = false;
  render();
  const thread = document.getElementById('assistant-thread');
  if(thread) thread.scrollTop = thread.scrollHeight;
}

async function checkSyncHealth(){

    syncHealthState = { checked:true, count: body.count||0, errors: body.errors||[], tables: body.tables||[], tablesOk: body.tables_ok_count||0, tablesTotal: body.tables_total||0 };

  render();
}

async function loadAudit(tableFilter){
  auditState.loading = true; render();
  try{
    let url = '/api/audit?limit=300';
    if(tableFilter) url += `&table_name=${encodeURIComponent(tableFilter)}`;
    const res = await apiFetch(url, { method:'GET' });
    const body = await res.json();
    if(!res.ok) throw new Error(body.error || 'Could not load the audit log.');
    auditState.entries = body.audit_log || [];
    auditState.error = null;
  }catch(e){ auditState.error = e.message; }
  auditState.loading = false;
  render();
}
function diffSummary(oldData, newData){
  if(!oldData) return 'Created';
  if(!newData) return 'Deleted';
  const changed = [];
  const keys = new Set([...Object.keys(oldData||{}), ...Object.keys(newData||{})]);
  for(const k of keys){
    if(['updated_at','created_at'].includes(k)) continue;
    const a = JSON.stringify(oldData[k]), b = JSON.stringify(newData[k]);
    if(a !== b) changed.push(`${k}: ${a} → ${b}`);
  }
  return changed.length ? changed.join('; ') : 'No field changes';
}

const KES = n => 'KES ' + Math.round(n||0).toLocaleString('en-KE');
const KES0 = n => Math.round(n||0).toLocaleString('en-KE');
// Generic client-side pagination — keyed per table so each list (Expenses,
// Audit Log, etc.) remembers its own page independently. Deliberately
// simple: slice-after-everything-else, so it's applied only to what
// actually gets rendered in a table body, never to a total/sum that was
// already computed from the full filtered set beforehand.
const paginationState = {};
function getPagination(key, pageSize){
  if(!paginationState[key]) paginationState[key] = { page: 1, pageSize: pageSize || 25 };
  return paginationState[key];
}
function paginateRows(key, rows, pageSize){
  const p = getPagination(key, pageSize);
  const totalPages = Math.max(1, Math.ceil(rows.length / p.pageSize));
  if(p.page > totalPages) p.page = totalPages; // filters just narrowed the set — don't strand on an empty page
  const start = (p.page - 1) * p.pageSize;
  return { pageRows: rows.slice(start, start + p.pageSize), page: p.page, totalPages, totalCount: rows.length, start: rows.length ? start+1 : 0, end: Math.min(start + p.pageSize, rows.length) };
}
function paginationControlsHtml(key, info){
  if(info.totalCount === 0) return '';
  return `
    <div style="display:flex; align-items:center; justify-content:space-between; padding:10px 4px; font-size:12.5px; color:var(--muted);">
      <span>Showing ${info.start}–${info.end} of ${info.totalCount}</span>
      <div style="display:flex; gap:6px; align-items:center;">
        <button class="btn ghost sm" data-page-prev="${key}" ${info.page<=1?'disabled':''}>&larr; Prev</button>
        <span>Page ${info.page} of ${info.totalPages}</span>
        <button class="btn ghost sm" data-page-next="${key}" ${info.page>=info.totalPages?'disabled':''}>Next &rarr;</button>
      </div>
    </div>`;
}
function wirePaginationControls(){
  document.querySelectorAll('[data-page-prev]').forEach(b=>b.addEventListener('click', ()=>{
    const p = getPagination(b.dataset.pagePrev); if(p.page>1){ p.page--; render(); }
  }));
  document.querySelectorAll('[data-page-next]').forEach(b=>b.addEventListener('click', ()=>{
    const p = getPagination(b.dataset.pageNext); p.page++; render();
  }));
}
// Generic client-side table sorting — same "keyed per table" pattern as
// pagination, and deliberately composes with it: sort the full filtered
// set FIRST, then hand the result to paginateRows(), so sorting a column
// re-orders which rows land on which page rather than only sorting
// within a single visible page.
const sortState = {};
function getSort(key, defaultSortKey, defaultDir){
  if(!sortState[key]) sortState[key] = { sortKey: defaultSortKey, dir: defaultDir || 'asc' };
  return sortState[key];
}
function sortRows(key, rows, valueFn, defaultSortKey, defaultDir){
  const s = getSort(key, defaultSortKey, defaultDir);
  const sorted = rows.slice().sort((a,b)=>{
    const av = valueFn(a, s.sortKey), bv = valueFn(b, s.sortKey);
    if(av < bv) return s.dir === 'asc' ? -1 : 1;
    if(av > bv) return s.dir === 'asc' ? 1 : -1;
    return 0;
  });
  return sorted;
}
function sortableHeaderHtml(label, columnKey, tableKey){
  const s = getSort(tableKey);
  const active = s.sortKey === columnKey;
  const arrow = active ? (s.dir === 'asc' ? ' ▲' : ' ▼') : '';
  return `<th data-sort-header="${tableKey}" data-sort-key="${columnKey}" style="cursor:pointer; user-select:none;" title="Sort by ${label}">${label}${arrow}</th>`;
}
function wireSortableHeaders(){
  document.querySelectorAll('[data-sort-header]').forEach(th=>th.addEventListener('click', ()=>{
    const tableKey = th.dataset.sortHeader, columnKey = th.dataset.sortKey;
    const s = getSort(tableKey);
    if(s.sortKey === columnKey){ s.dir = s.dir === 'asc' ? 'desc' : 'asc'; }
    else { s.sortKey = columnKey; s.dir = 'asc'; }
    render();
  }));
}

let lastSynced = null; // last known-good server snapshot of the normalized entities, for diffing on save
let STORAGE_VERSION = null;

// Which local array maps to which endpoint, and how a local record turns
// into the shape that endpoint expects. Client-generated uuid() ids are
// sent as-is on create, so a record's id is stable from the moment it's
// added in the UI — no server round trip needed before it can be
// edited/deleted again.
const CORE_ENTITY_CONFIG = {
  dailyRevenue: {
    path: '/api/revenue',
    toApi: r => ({ id:r.id, branch_id: state.branchId, entry_date:r.date, amount_kes:Number(r.revenue_kes)||0, notes:r.notes||null })
  },
  expenses: {
    path: '/api/expenses',
    toApi: e => ({ id:e.id, branch_id: state.branchId, expense_date:e.date, txn_ref:e.txn_ref||null,
      account_name:e.account_used||null, category_name:e.category||null,
      description:e.description||null, paid_to:e.paid_to||null,
      amount_kes:Number(e.amount_kes)||0, charges_kes:Number(e.charges_kes)||0, owner_funded:!!e.owner_funded,
      status:e.status||'posted' })
  },
  loans: {
    path: '/api/loans',
    toApi: l => ({ id:l.id, branch_id: state.branchId, debt_name:l.debt_name, lender:l.lender||null,
      original_principal_kes:Number(l.original_principal_kes)||0, current_balance_kes:Number(l.current_balance_kes)||0,
      annual_interest_rate_pct:Number(l.annual_interest_rate_pct)||0, start_date:l.start_date||null,
      min_monthly_payment_kes:Number(l.min_monthly_payment_kes)||0, status:l.status||'ACTIVE' })
  },
  // Balance math (loan.current_balance_kes) is computed client-side, same
  // as this app already did — syncing the 'loans' array separately carries
  // that updated balance server-side, so this endpoint doesn't touch it.
  loanPayments: {
    path: '/api/loan-payments',
    toApi: p => ({ id:p.id, branch_id: state.branchId, loan_id:p.loan_id, payment_date:p.date, amount_kes:Number(p.amount_kes)||0, note:p.note||null })
  },
  taxObligations: {
    path: '/api/tax',
    toApi: t => ({ id:t.id, branch_id: state.branchId, tax_type:t.tax_type, applicable:!!t.applicable,
      frequency:t.frequency, due_day_of_month:t.due_day_of_month||null, manual_next_due_date:t.manual_next_due_date||null,
      estimated_amount_kes:Number(t.estimated_amount_kes)||0, filing_authority:t.filing_authority||null, notes:t.notes||null })
  }
};

function snapshotCore(){
  const s = {};
  for(const key of Object.keys(CORE_ENTITY_CONFIG)) s[key] = JSON.parse(JSON.stringify(state[key] || []));
  s.settings = JSON.parse(JSON.stringify(state.settings));
  return s;
}

async function syncEntityArray(key){
  const cfg = CORE_ENTITY_CONFIG[key];
  const current = state[key] || [];
  const prior = (lastSynced && lastSynced[key]) || [];
  const priorById = new Map(prior.map(x=>[x.id,x]));
  const currentIds = new Set(current.map(x=>x.id));
  const ops = [];

  for(const rec of current){
    const before = priorById.get(rec.id);
    if(!before){
      ops.push(apiCreate(cfg.path, cfg.toApi(rec)));
    } else if(JSON.stringify(before) !== JSON.stringify(rec)){
      ops.push(apiUpdate(cfg.path, cfg.toApi(rec)));
    }
  }
  for(const rec of prior){
    if(!currentIds.has(rec.id)){
      ops.push(apiRemove(cfg.path, { branch_id: state.branchId, id: rec.id }));
    }
  }
  await Promise.all(ops);
}

async function syncSettings(){
  const s = state.settings;
  const before = lastSynced ? lastSynced.settings : null;
  if(before && JSON.stringify(before) === JSON.stringify(s)) return;
  await apiPutSettings({
    branch_id: state.branchId,
    pct_profit: s.pct_profit, pct_owner_debt: s.pct_owner_debt, pct_tax: s.pct_tax, pct_opex: s.pct_opex,
    debt_paydown_split_pct: s.debt_paydown_split_pct,
    monthly_revenue_target_kes: s.monthly_revenue_target_kes,
    opening_opex_account_balance_kes: s.opening_opex_account_balance_kes
  });
}

async function loadState(preferredBranchId){
  const me = await apiGetMe();
  currentUserEmail = me.user ? me.user.email : currentUserEmail; // always prefer the server-verified email over whatever the session object had
  if(!me.branches || me.branches.length === 0){
    throw new Error('Your account has no branch access yet — ask an admin to grant you access.');
  }
  availableBranches = me.branches;
  const lastUsed = localStorage.getItem('happynet_last_branch');
  const branch = availableBranches.find(b => b.branch_id === preferredBranchId)
    || availableBranches.find(b => b.branch_id === lastUsed)
    || availableBranches[0];
  const branchId = branch.branch_id;
  localStorage.setItem('happynet_last_branch', branchId);

  const [revRes, expRes, loanRes, payRes, taxRes, settingsRaw, miscData] = await Promise.all([
    apiList('/api/revenue', branchId),
    apiList('/api/expenses', branchId),
    apiList('/api/loans', branchId),
    apiList('/api/loan-payments', branchId),
    apiList('/api/tax', branchId),
    apiFetch('/api/settings?branch_id=' + branchId, { method:'GET' }).then(r => r.json()),
    apiGetBranchMisc(branchId)
  ]);

  const d = defaultState(); // used only as a fallback shape now, not seed data

    role: branch.role,
    isHeadOffice: !!me.is_head_office,
    allBranches: availableBranches,
    dailyRevenue: (revRes.revenue || []).map(r => ({ id:r.id, date:r.entry_date, revenue_kes:Number(r.amount_kes), notes:r.notes || '' })),
    expenses: (expRes.expenses || []).map(e => ({
      id:e.id, date:e.expense_date, txn_ref:e.txn_ref || '',
      account_used: (e.financial_accounts && e.financial_accounts.name) || '',
      category: (e.categories && e.categories.name) || '',
      description:e.description || '', paid_to:e.paid_to || '',
      amount_kes:Number(e.amount_kes), charges_kes:Number(e.charges_kes || 0), owner_funded:!!e.owner_funded,
      status:e.status || 'posted'
    })),
    loans: (loanRes.loans || []).map(l => ({
      id:l.id, debt_name:l.debt_name, lender:l.lender || '',
      original_principal_kes:Number(l.original_principal_kes),
      annual_interest_rate_pct:Number(l.annual_interest_rate_pct || 0),
      start_date:l.start_date || '', min_monthly_payment_kes:Number(l.min_monthly_payment_kes || 0),
      current_balance_kes:Number(l.current_balance_kes), status:l.status || 'ACTIVE'
    })),
    loanPayments: (payRes.loan_payments || []).map(p => ({
      id:p.id, loan_id:p.loan_id, date:p.payment_date, amount_kes:Number(p.amount_kes), note:p.note || ''
    })),
    taxObligations: (taxRes.tax_obligations || []).map(t => ({
      id:t.id, tax_type:t.tax_type, applicable:!!t.applicable, frequency:t.frequency,
      due_day_of_month:t.due_day_of_month, manual_next_due_date:t.manual_next_due_date || '',
      estimated_amount_kes:Number(t.estimated_amount_kes || 0), filing_authority:t.filing_authority || '', notes:t.notes || ''
    })),
    monthlyArchive: (miscData && miscData.monthlyArchive) || [],
    closedMonths: (miscData && miscData.closedMonths) || [],
    categories: (miscData && miscData.categories && miscData.categories.length) ? miscData.categories : d.categories,
    settings: settingsRaw.settings ? {
      pct_profit:Number(settingsRaw.settings.pct_profit),
      pct_owner_debt:Number(settingsRaw.settings.pct_owner_debt),
      pct_tax:Number(settingsRaw.settings.pct_tax),
      pct_opex:Number(settingsRaw.settings.pct_opex),
      debt_paydown_split_pct:Number(settingsRaw.settings.debt_paydown_split_pct),
      monthly_revenue_target_kes:Number(settingsRaw.settings.monthly_revenue_target_kes || 0),

function queueSave(){
  clearTimeout(saveTimer);
  saveStatus = 'saving'; renderSaveBadge();
  saveTimer = setTimeout(async () => {
    try{
      await Promise.all([
        syncEntityArray('dailyRevenue'),
        syncEntityArray('expenses'),
        syncEntityArray('loans'),
        syncEntityArray('loanPayments'),
        syncEntityArray('taxObligations'),
        syncSettings(),
        // Real per-branch home for these three — this is what the UI
        // actually reads back on next load (see apiGetBranchMisc above).
        apiSaveBranchMisc(state.branchId, {
          categories: state.categories, monthlyArchive: state.monthlyArchive, closedMonths: state.closedMonths
        }),
        // /api/state's POST fully REPLACES the stored blob rather than
        // merging — so this keeps writing the complete state (not just
        // categories/archive/closedMonths) to preserve app_state as a
        // whole-app mirror/rollback point. NOTE: app_state is a single
        // global row, not branch-scoped, so across multiple branches this
        // mirror only ever reflects whichever branch saved most recently —
        // it's a rollback safety net, not a per-branch source of truth.
        apiSaveState({
          dailyRevenue: state.dailyRevenue, expenses: state.expenses, loans: state.loans,
          loanPayments: state.loanPayments, taxObligations: state.taxObligations,
          settings: state.settings, categories: state.categories,
          monthlyArchive: state.monthlyArchive, closedMonths: state.closedMonths
        })
      ]);
      lastSynced = snapshotCore();
      saveStatus = 'saved';
    } catch(e){
      console.error('save failed', e);
      saveStatus = 'error';
    }
    renderSaveBadge();
  }, 600);
}

function renderSaveBadge(){
  const el = document.getElementById('save-badge');
  if(!el) return;
  const map = { idle:'', saving:'Saving…', saved:'Saved', error:'Save failed — check connection' };
  el.textContent = map[saveStatus] || '';
  el.className = 'save-badge ' + saveStatus;
}

/* ---------------- Derived / business logic ---------------- */

function pf(revenue){
  const s = state.settings;
  return {
    profit: revenue * s.pct_profit/100,
    owner_debt: revenue * s.pct_owner_debt/100,
    tax: revenue * s.pct_tax/100,
    opex: revenue * s.pct_opex/100
  };
}

function currentOpenMonth(){
  const active = state.dailyRevenue
    .map(r => monthKey(r.date))
    .filter(m => !state.closedMonths.includes(m));
  if(active.length === 0) return monthKey(todayISO());
  return active.sort().slice(-1)[0];
}

function revenueForMonth(ym){ return state.dailyRevenue.filter(r => monthKey(r.date) === ym); }
// Pending-approval and rejected expenses are real rows (visible, editable,
// approvable) but shouldn't move any money total until a Branch Manager or
// Head Office approves them — this is the one place that filter needs to
// live, since every other total is built from these two functions.
function postedExpenses(){ return state.expenses.filter(e => e.status !== 'pending_approval' && e.status !== 'rejected'); }
function statusTag(status){
  if(status==='pending_approval') return `<span class="tag neutral" style="background:var(--tone-gold-soft); color:var(--gold-deep);">Pending</span>`;
  if(status==='rejected') return `<span class="tag alert">Rejected</span>`;
  return `<span class="tag good">Posted</span>`;
}
async function approveExpense(id){
  try{
    await apiUpdate('/api/expenses', { branch_id: state.branchId, id, status:'posted', approve:true });
    const rec = state.expenses.find(e=>e.id===id);
    if(rec) rec.status = 'posted';
    lastSynced.expenses = JSON.parse(JSON.stringify(state.expenses));
    render();
  }catch(e){ showToast('Could not approve: '+e.message, 'error'); }
}
async function rejectExpense(id){
  try{
    await apiUpdate('/api/expenses', { branch_id: state.branchId, id, status:'rejected' });
    const rec = state.expenses.find(e=>e.id===id);
    if(rec) rec.status = 'rejected';
    lastSynced.expenses = JSON.parse(JSON.stringify(state.expenses));
    render();
  }catch(e){ showToast('Could not reject: '+e.message, 'error'); }
}
function expensesForMonth(ym){ return postedExpenses().filter(e => monthKey(e.date) === ym); }

function grossExpenseOn(date){ return postedExpenses().filter(e=>e.date===date).reduce((s,e)=>s+e.amount_kes+e.charges_kes,0); }
function ownerFundedOn(date){ return postedExpenses().filter(e=>e.date===date && e.owner_funded).reduce((s,e)=>s+e.amount_kes+e.charges_kes,0); }
function netExpenseOn(date){ return grossExpenseOn(date) - ownerFundedOn(date); }

function monthTotals(ym){
  const revRows = revenueForMonth(ym);
  const expRows = expensesForMonth(ym);
  const totalRevenue = revRows.reduce((s,r)=>s+r.revenue_kes,0);
  const grossOpex = expRows.reduce((s,e)=>s+e.amount_kes+e.charges_kes,0);
  const ownerFunded = expRows.filter(e=>e.owner_funded).reduce((s,e)=>s+e.amount_kes+e.charges_kes,0);
  const netOpex = grossOpex - ownerFunded;
  const alloc = pf(totalRevenue);
  const daysElapsed = revRows.length;
  const dim = daysInMonth(ym);
  return { totalRevenue, grossOpex, ownerFunded, netOpex, alloc, daysElapsed, dim, revRows, expRows };
}

function dashboardData(){
  const ym = currentOpenMonth();
  const t = monthTotals(ym);
  const target = state.settings.monthly_revenue_target_kes;
  const paceTarget = target * (t.daysElapsed / t.dim);
  const revenuePacePct = paceTarget > 0 ? (t.totalRevenue / paceTarget) * 100 : 0;
  const opexPacePct = t.alloc.opex > 0 ? (t.netOpex / t.alloc.opex) * 100 : 0;
  const projRevenue = t.daysElapsed > 0 ? (t.totalRevenue / t.daysElapsed) * t.dim : 0;
  const projOpex = t.daysElapsed > 0 ? (t.netOpex / t.daysElapsed) * t.dim : 0;
  const overspent = t.netOpex > t.alloc.opex;
  const opexVariance = t.alloc.opex - t.netOpex;
  return { ym, ...t, target, revenuePacePct, opexPacePct, projRevenue, projOpex, overspent, opexVariance };
}

function narrativeText(d){
  const monthName = monthLabel(d.ym);
  const revStatus = d.revenuePacePct >= 100 ? 'ahead of pace' : d.revenuePacePct >= 85 ? 'close to pace' : 'behind pace';
  const opexStatus = d.overspent ? `overspent by ${KES(Math.abs(d.opexVariance))}` : `within budget with ${KES(d.opexVariance)} left`;
  const projLine = d.projRevenue >= d.target
    ? `If this pace holds, ${monthName} should close above the ${KES(d.target)} target.`
    : `If this pace holds, ${monthName} will land around ${KES(d.projRevenue)}, short of the ${KES(d.target)} target.`;
  return `Day ${d.daysElapsed} of ${d.dim} in ${monthName}: revenue is ${revStatus} at ${d.revenuePacePct.toFixed(0)}% of target pace, `+
    `and Operating Expenses are ${opexStatus} against the ${KES(d.alloc.opex)} allocated so far. ${projLine} `+
    `Projected month-end OpEx sits at ${KES(d.projOpex)}.`;
}

function signalLevel(pct){
  if(pct >= 100) return 4;
  if(pct >= 80) return 3;
  if(pct >= 50) return 2;
  return 1;
}

function loanSummary(){
  const totalOriginal = state.loans.reduce((s,l)=>s+Number(l.original_principal_kes||0),0);
  const totalBalance = state.loans.reduce((s,l)=>s+Number(l.current_balance_kes||0),0);
  const pctCleared = totalOriginal > 0 ? ((totalOriginal-totalBalance)/totalOriginal)*100 : 0;
  const ym = currentOpenMonth();
  const t = monthTotals(ym);
  const availableThisMonth = t.alloc.owner_debt * (state.settings.debt_paydown_split_pct/100);
  // average monthly paydown across months with payments
  const byMonth = {};
  state.loanPayments.forEach(p => { const m = monthKey(p.date); byMonth[m]=(byMonth[m]||0)+Number(p.amount_kes||0); });
  const months = Object.keys(byMonth);
  const avgMonthly = months.length ? Object.values(byMonth).reduce((a,b)=>a+b,0)/months.length : 0;
  let projectedDate = 'Not enough data yet';
  if(avgMonthly > 0 && totalBalance > 0){
    const monthsLeft = Math.ceil(totalBalance/avgMonthly);
    const d = new Date(); d.setMonth(d.getMonth()+monthsLeft);
    projectedDate = d.toLocaleString('en-US',{month:'long',year:'numeric'});
  } else if(totalBalance <= 0 && state.loans.length){
    projectedDate = 'Debt-free';
  }
  return { totalOriginal, totalBalance, pctCleared, availableThisMonth, avgMonthly, projectedDate };
}

// Unsaved-changes tracking — deliberately scoped to the forms that
// represent real typed effort worth protecting (financial-record entry
// forms), not every checkbox/filter in the app. A form is marked dirty
// only on a genuine user 'input' event, never by programmatic value
// assignment (pre-filling from document intelligence, for instance,

function trackFormDirty(formEl){
  if(!formEl) return;

function root(){ return document.getElementById('root'); }

let toasts = []; // {id, message, type:'success'|'error'|'info'}
let toastCounter = 0;
// The toast stack and dialogs render into their own root (#overlay-root,
// outside #root entirely), never through the app's main render() — that
// function tears down and rebuilds the whole current tab from its
// template on every call, which would silently wipe any live,
// uncommitted form input the person is still typing the instant a toast
// or dialog appears. renderOverlay() only ever touches #overlay-root.
function renderOverlay(){
  const el = document.getElementById('overlay-root');
  if(!el) return;
  el.innerHTML = toastAndDialogHtml();
  wireToastAndDialog();
  wirePalette();
}
function showToast(message, type){
  const id = ++toastCounter;
  toasts.push({ id, message, type: type || 'info' });
  renderOverlay();
  setTimeout(()=>{ toasts = toasts.filter(t=>t.id!==id); renderOverlay(); }, 5000);
}
function dismissToast(id){ toasts = toasts.filter(t=>t.id!==id); renderOverlay(); }

// Styled replacements for confirm()/prompt() — resolve like the native
// versions (confirm resolves true/false, prompt resolves a string or
// null), but render as a modal matching the rest of the app instead of a
// blocking, unstyled browser dialog.
let activeDialog = null; // {kind:'confirm'|'prompt', message, defaultValue, resolve}
function confirmDialog(message){
  return new Promise(resolve => {
    activeDialog = { kind:'confirm', message, resolve };
    renderOverlay();
  });
}
function promptDialog(message, defaultValue){
  return new Promise(resolve => {
    activeDialog = { kind:'prompt', message, defaultValue: defaultValue||'', resolve };
    renderOverlay();
  });
}
function resolveDialog(value){
  if(activeDialog){
    activeDialog.resolve(value);
    activeDialog = null;
    renderOverlay();
  }
}
function toastAndDialogHtml(){
  return `
    <div class="toast-stack no-print">
      ${toasts.map(t=>`<div class="toast toast-${t.type}"><span>${t.message}</span><button data-dismiss-toast="${t.id}">&times;</button></div>`).join('')}
    </div>
    ${activeDialog ? `
    <div class="modal-backdrop"><div class="modal" style="max-width:440px;">
      <p style="margin:0 0 16px; font-size:14.5px; line-height:1.5;">${activeDialog.message}</p>
      ${activeDialog.kind==='prompt' ? `<input type="text" id="dialog-input" value="${activeDialog.defaultValue}" style="margin-bottom:16px;" autofocus>` : ''}
      <div style="display:flex; gap:10px; justify-content:flex-end;">
        <button class="btn ghost" id="btn-dialog-cancel">Cancel</button>
        <button class="btn gold" id="btn-dialog-confirm">${activeDialog.kind==='prompt'?'Submit':'Confirm'}</button>
      </div>
    </div></div>` : ''}
    ${paletteOpen ? paletteHtml() : ''}
  `;
}
// Command palette — Cmd/Ctrl+K. Renders through the same independent
// overlay root as toasts/dialogs, for the exact reason discovered while
// building the unsaved-changes warning: anything shown through the main
// render() tears down and rebuilds the current tab from its template,
// silently wiping any live, uncommitted form input. Opening the palette
// must never do that, regardless of what the person was in the middle of
// typing when they hit the shortcut.
let paletteOpen = false, paletteQuery = '', paletteSelectedIndex = 0;
function paletteMatches(){
  const q = paletteQuery.trim().toLowerCase();
  const items = visibleTabs();
  if(!q) return items;
  return items.filter(t => t.label.toLowerCase().includes(q));
}
function openPalette(){
  paletteOpen = true; paletteQuery = ''; paletteSelectedIndex = 0;
  renderOverlay();
  setTimeout(()=>{ const el = document.getElementById('palette-input'); if(el) el.focus(); }, 0);
}
function closePalette(){ paletteOpen = false; renderOverlay(); }
function paletteHtml(){
  return `
    <div class="modal-backdrop" id="palette-backdrop" style="align-items:flex-start; padding-top:12vh;">
      <div class="modal" style="max-width:480px; padding:0; overflow:hidden;">
        <input type="text" id="palette-input" placeholder="Jump to a tab…" value="${paletteQuery}"
          style="border:none; border-bottom:1px solid var(--hair); border-radius:0; padding:16px 18px; font-size:15px;">
        <div id="palette-results" style="max-height:320px; overflow-y:auto; padding:6px;">${paletteResultsHtml()}</div>
        <div style="padding:8px 14px; border-top:1px solid var(--hair); font-size:11.5px; color:var(--muted); display:flex; gap:14px;">
          <span>&uarr;&darr; navigate</span><span>&crarr; select</span><span>esc close</span>
        </div>
      </div>
    </div>`;
}
function paletteResultsHtml(){
  const matches = paletteMatches();
  return matches.length===0 ? `<div style="padding:14px 12px; color:var(--muted); font-size:13.5px;">No matching tab.</div>` : matches.map((t,i)=>`
    <div data-palette-item="${t.id}" style="display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:8px; cursor:pointer; ${i===paletteSelectedIndex?'background:var(--neutral-soft);':''}">
      ${ic(t.icon,16)}<span>${t.label}</span>
    </div>`).join('');
}
// Re-renders ONLY the results list, never the palette's own <input> — the
// exact same lesson as the unsaved-changes fix, just discovered a second
// time inside the palette itself: regenerating the whole overlay on every
// keystroke destroys and recreates the focused input element, losing
// focus (and the cursor) after the very first character typed.
function updatePaletteResults(){
  const el = document.getElementById('palette-results');
  if(el){ el.innerHTML = paletteResultsHtml(); wirePaletteResultClicks(); }
}
function wirePaletteResultClicks(){
  document.querySelectorAll('[data-palette-item]').forEach(el=>el.addEventListener('click', ()=>{
    const id = el.dataset.paletteItem; closePalette(); setTab(id);
  }));
}
function wirePalette(){
  const input = document.getElementById('palette-input');
  if(input) input.addEventListener('input', ()=>{ paletteQuery = input.value; paletteSelectedIndex = 0; updatePaletteResults(); });
  wirePaletteResultClicks();
  const backdrop = document.getElementById('palette-backdrop');
  if(backdrop) backdrop.addEventListener('click', (e)=>{ if(e.target === backdrop) closePalette(); });
}
document.addEventListener('keydown', (e)=>{
  const isCmdK = (e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k';
  if(isCmdK){
    e.preventDefault();
    if(paletteOpen) closePalette(); else openPalette();
    return;
  }
  if(!paletteOpen) return;
  if(e.key === 'Escape'){ e.preventDefault(); closePalette(); }
  else if(e.key === 'ArrowDown'){ e.preventDefault(); paletteSelectedIndex = Math.min(paletteSelectedIndex+1, paletteMatches().length-1); updatePaletteResults(); }
  else if(e.key === 'ArrowUp'){ e.preventDefault(); paletteSelectedIndex = Math.max(paletteSelectedIndex-1, 0); updatePaletteResults(); }
  else if(e.key === 'Enter'){
    e.preventDefault();
    const matches = paletteMatches();
    const chosen = matches[paletteSelectedIndex];
    if(chosen){ closePalette(); setTab(chosen.id); }
  }
});
function wireToastAndDialog(){
  document.querySelectorAll('[data-dismiss-toast]').forEach(b=>b.addEventListener('click',()=>dismissToast(Number(b.dataset.dismissToast))));
  const btnCancel = document.getElementById('btn-dialog-cancel');
  if(btnCancel) btnCancel.addEventListener('click', ()=> resolveDialog(activeDialog.kind==='prompt' ? null : false));
  const btnConfirm = document.getElementById('btn-dialog-confirm');
  if(btnConfirm) btnConfirm.addEventListener('click', ()=>{
    if(activeDialog.kind==='prompt'){
      const input = document.getElementById('dialog-input');
      resolveDialog(input ? input.value : '');
    } else {
      resolveDialog(true);
    }
  });
  const dialogInput = document.getElementById('dialog-input');
  if(dialogInput) dialogInput.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); btnConfirm.click(); } });
}

// Disables a form's submit button for the duration of an async operation
// — a purely mechanical safety net against double-submission (two fast
// clicks creating two financial records) that never touches what the
// operation itself does. Restoring the button's text/state in `finally`
// is mostly a formality (a subsequent render() typically replaces the DOM
// anyway), but covers the cases where it doesn't.
async function withSubmitLock(form, asyncFn){
  const btn = form.querySelector('button[type=submit]');
  const originalText = btn ? btn.innerHTML : null;
  if(btn){ btn.disabled = true; btn.innerHTML = 'Saving…'; }
  try{
    await asyncFn();
  } finally {
    if(btn && document.body.contains(btn)){ btn.disabled = false; btn.innerHTML = originalText; }
  }
}
// Same idea, for a standalone action button (Approve, Pay, Import) rather
// than a <form>'s submit button.
async function withButtonLock(btn, asyncFn){
  if(!btn){ await asyncFn(); return; }
  const originalText = btn.innerHTML;
  btn.disabled = true; btn.innerHTML = 'Working…';
  try{
    await asyncFn();
  } finally {
    if(document.body.contains(btn)){ btn.disabled = false; btn.innerHTML = originalText; }
  }
}

let revenueImportResult = null;

// Detects and parses the raw M-Pesa Organization Utility Account
// statement export. This has a variable-length metadata header before the
// real column row — found by locating the row that starts with "Receipt
// No.", not by assuming a fixed row number. Only settlement-sweep rows
// (Utility Account -> Organization Settlement Account) are counted:
// that's the actual revenue signal this report captures — the file's own
// header total ("Total Withdrawn") is exactly the sum of those sweeps.
function parseOrgUtilityGrid(grid){
  const headerIdx = grid.findIndex(row => (row[0]||'').toString().trim() === 'Receipt No.');
  if(headerIdx === -1) return null; // not this format — let the caller show its normal error
  const header = grid[headerIdx].map(c=>String(c||'').trim());
  const col = name => header.indexOf(name);
  const idx = { completion: col('Completion Time'), details: col('Details'), withdrawn: col('Withdrawn') };
  const byDate = {};
  for(let r=headerIdx+1; r<grid.length; r++){
    const row = grid[r]; if(!row || !row[0]) continue;
    if(!/Utility Account to Organization Settlement Account/i.test(row[idx.details]||'')) continue;
    const withdrawn = Math.abs(Number(String(row[idx.withdrawn]||'0').replace(/,/g,'')) || 0);
    if(withdrawn <= 0) continue;
    const parts = String(row[idx.completion]||'').split(' ')[0].split('-'); // DD-MM-YYYY
    if(parts.length !== 3) continue;
    const iso = `${parts[2]}-${parts[1]}-${parts[0]}`;
    byDate[iso] = (byDate[iso]||0) + withdrawn;
  }
  return byDate;
}

async function handleRevenueImport(ev){
  const file = ev.target.files[0];
  if(!file) return;
  const statusEl = document.getElementById('import-revenue-status');
  if(statusEl) statusEl.innerHTML = `<span class="hint">Reading ${file.name}…</span>`;
  try{
    const data = await file.arrayBuffer();
    const wb = XLSX.read(data, {type:'array'});
    const ws = wb.Sheets[wb.SheetNames[0]];
    const grid = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:null});

    const byDate = parseOrgUtilityGrid(grid);
    if(!byDate){
      revenueImportResult = { imported:0, skippedExisting:0, errors:['Could not find a "Receipt No." column — is this an Organization Utility statement export?'] };
      if(statusEl) statusEl.innerHTML=''; render(); ev.target.value=''; return;
    }

    const existingDates = new Set(state.dailyRevenue.map(r=>r.date));
    const newRows = [];
    let skippedExisting = 0;
    for(const [date, amount] of Object.entries(byDate)){
      if(existingDates.has(date)){ skippedExisting++; continue; }
      newRows.push({ id: uid(), date, revenue_kes: Math.round(amount), notes: 'Imported from Organization Utility statement' });
    }
    newRows.sort((a,b)=>a.date<b.date?-1:1);

    let confirmedRows = [];
    const errors = [];
    if(newRows.length){
      if(statusEl) statusEl.innerHTML = `<span class="hint">Saving ${newRows.length} day(s)…</span>`;
      try{
        const entries = newRows.map(CORE_ENTITY_CONFIG.dailyRevenue.toApi);
        const apiResult = await apiCreate('/api/revenue', { branch_id: state.branchId, entries });
        const insertedIds = new Set((apiResult.inserted||[]).map(x=>x.id));
        confirmedRows = newRows.filter(r=>insertedIds.has(r.id));
        for(const skip of (apiResult.skipped||[])){ skippedExisting++; errors.push(skip.reason || 'A day was skipped by the server.'); }
      }catch(err){
        revenueImportResult = { imported:0, skippedExisting, errors:[...errors, 'Save failed: '+err.message] };
        if(statusEl) statusEl.innerHTML=''; render(); ev.target.value=''; return;
      }
    }
    state.dailyRevenue = state.dailyRevenue.concat(confirmedRows);
    if(lastSynced) lastSynced.dailyRevenue = JSON.parse(JSON.stringify(state.dailyRevenue));
    revenueImportResult = { imported: confirmedRows.length, skippedExisting, errors };
    render();
  }catch(err){
    revenueImportResult = { imported:0, skippedExisting:0, errors:['Could not read this file: '+err.message] };
    render();
  }
  ev.target.value = '';
}

async function bulkApproveExpenses(ids){
  if(ids.length === 0) return;
  if(!(await confirmDialog(`Approve ${ids.length} expense(s)? This posts them all to the ledger and they'll count toward this month's totals.`))) return;
  let succeeded = 0, failed = 0;
  for(const id of ids){
    try{
      await apiUpdate('/api/expenses', { branch_id: state.branchId, id, status:'posted', approve:true });
      const rec = state.expenses.find(e=>e.id===id);
      if(rec) rec.status = 'posted';
      succeeded++;
    }catch(e){ failed++; }
  }
  lastSynced.expenses = JSON.parse(JSON.stringify(state.expenses));
  selectedExpenseIds.clear();
  showToast(failed === 0 ? `${succeeded} expense(s) approved.` : `${succeeded} approved, ${failed} failed — check them individually.`, failed === 0 ? 'success' : 'error');
  render();
}
async function bulkRejectExpenses(ids){
  if(ids.length === 0) return;
  if(!(await confirmDialog(`Reject ${ids.length} expense(s)? They won't count toward this month's totals.`))) return;
  let succeeded = 0, failed = 0;
  for(const id of ids){
    try{
      await apiUpdate('/api/expenses', { branch_id: state.branchId, id, status:'rejected' });
      const rec = state.expenses.find(e=>e.id===id);
      if(rec) rec.status = 'rejected';
      succeeded++;
    }catch(e){ failed++; }
  }
  lastSynced.expenses = JSON.parse(JSON.stringify(state.expenses));
  selectedExpenseIds.clear();
  showToast(failed === 0 ? `${succeeded} expense(s) rejected.` : `${succeeded} rejected, ${failed} failed — check them individually.`, failed === 0 ? 'success' : 'error');
  render();
}

  let rows = state.expenses.slice();
  if(expenseFilters.category) rows = rows.filter(e=>e.category===expenseFilters.category);
  if(expenseFilters.account) rows = rows.filter(e=>e.account_used===expenseFilters.account);
  if(expenseFilters.ownerFundedOnly) rows = rows.filter(e=>e.owner_funded);
  if(expenseFilters.pendingOnly) rows = rows.filter(e=>e.status==='pending_approval');
  rows = sortRows('expenses', rows, (row, key) => {
    if(key==='amount') return row.amount_kes + row.charges_kes;
    if(key==='account') return row.account_used;
    if(key==='category') return row.category;
    if(key==='status') return row.status;
    return row.date; // default and 'date'
  }, 'date', 'asc');
  return rows;
}
